<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Mode - الطالب</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1><i class="fas fa-user-graduate"></i> Focus Mode - الطالب</h1>
            <div style="background: #3b82f620; padding: 0.5rem 1rem; border-radius: 2rem;">
                <i class="fas fa-user"></i> مرحباً <strong id="studentNameDisplay"></strong> | 
                <button onclick="logout()" style="background:none; border:none; color:#facc15; cursor:pointer;">
                    <i class="fas fa-sign-out-alt"></i> تسجيل خروج
                </button>
            </div>
        </div>

        <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙</button>

        <div class="student-grid">
            <!-- قسم رفع الإجابة -->
            <div class="submit-card">
                <h3><i class="fas fa-upload"></i> رفع إجابتك</h3>
                <div class="form-group">
                    <label>👤 اسمك</label>
                    <input type="text" id="studentName" disabled>
                </div>
                <div class="form-group">
                    <label>📝 إجابتك (نص)</label>
                    <textarea id="answerText" rows="3" placeholder="اكتب حلك هنا..."></textarea>
                </div>
                <div class="form-group">
                    <label>🖼️ أو ارفع صورة الحل</label>
                    <input type="file" id="answerImage" accept="image/*">
                    <div id="imagePreview"></div>
                </div>
                <button id="submitBtn" class="btn btn-primary btn-block">
                    <i class="fas fa-paper-plane"></i> إرسال الإجابة
                </button>
                <div id="submitStatus" class="submit-status"></div>
                
                <!-- عرض النقاط -->
                <div class="stats-card" style="margin-top: 1rem;">
                    <h4><i class="fas fa-star"></i> رصيدك من النقاط</h4>
                    <div id="myPointsDisplay" style="font-size: 2rem; color:#facc15;">0</div>
                    <div id="myBadgesDisplay"></div>
                </div>
            </div>

            <!-- قسم الردود والجدول والملفات -->
            <div>
                <div class="feedback-card">
                    <h3><i class="fas fa-comments"></i> ردود الأستاذ</h3>
                    <div id="myFeedback" class="feedback-list">
                        <div class="empty-state">📬 ستظهر هنا ردود الأستاذ</div>
                    </div>
                </div>
                
                <div class="schedule-card" style="margin-top: 1rem;">
                    <h3><i class="fas fa-calendar-alt"></i> جدول المذاكرة اليومي</h3>
                    <div id="studentScheduleList" class="schedule-list">
                        <div class="empty-state">📅 يتم التحميل...</div>
                    </div>
                </div>
                
                <div class="files-card" style="margin-top: 1rem;">
                    <h3><i class="fas fa-folder-open"></i> الملفات المشتركة من الأستاذ</h3>
                    <div id="studentFilesList" class="files-grid">
                        <div class="empty-state">📂 جاري التحميل...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script>
        // 🔥 إعدادات Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCFydOV8EjlhD4AASTZFU1keYA3I6UQHyw",
            authDomain: "foucsmode-95e4f.firebaseapp.com",
            projectId: "foucsmode-95e4f",
            storageBucket: "foucsmode-95e4f.firebasestorage.app",
            messagingSenderId: "972730357334",
            appId: "1:972730357334:web:f2d3044a7c8eed588b8df7",
            measurementId: "G-519W7HSYD7"
        };
        
        // تهيئة Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();
        
        // ☁️ إعدادات Cloudinary
        const CLOUDINARY_CLOUD_NAME = "dt1lrpvhq";
        const CLOUDINARY_UPLOAD_PRESET = "focus_mode_preset"; // 🔁 أنشئ هذا الـ Preset في Cloudinary
        
        let currentUser = null;
        let currentUserData = null;
        
        // التحقق من تسجيل الدخول
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            
            currentUser = user;
            const snapshot = await database.ref(`users/${user.uid}`).once('value');
            currentUserData = snapshot.val();
            
            if (!currentUserData || currentUserData.role !== 'student') {
                window.location.href = 'login.html';
                return;
            }
            
            document.getElementById('studentName').value = currentUserData.displayName;
            document.getElementById('studentNameDisplay').innerText = currentUserData.displayName;
            
            loadStudentData();
        });
        
        function logout() {
            auth.signOut().then(() => {
                window.location.href = 'login.html';
            });
        }
        
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const btn = document.getElementById('themeToggle');
            btn.innerHTML = document.body.classList.contains('light-theme') ? '☀️' : '🌙';
            localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        }
        if(localStorage.getItem('theme') === 'light') toggleTheme();
        
        // ☁️ دالة رفع الصورة إلى Cloudinary
        async function uploadImageToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
            
            try {
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log("✅ تم رفع الصورة بنجاح:", data.secure_url);
                return data.secure_url;
                
            } catch (error) {
                console.error("❌ خطأ في رفع الصورة:", error);
                alert("فشل رفع الصورة. تأكد من إعدادات Cloudinary.");
                return null;
            }
        }
        
        async function loadStudentData() {
            if (!currentUser) return;
            await loadPoints();
            await loadStudentFeedback();
            await loadSchedule();
            await loadFiles();
            checkBroadcast();
        }
        
        async function loadPoints() {
            const snapshot = await database.ref(`users/${currentUser.uid}/points`).once('value');
            const points = snapshot.val() || 0;
            document.getElementById('myPointsDisplay').innerHTML = points;
            
            const badgesSnapshot = await database.ref(`users/${currentUser.uid}/badges`).once('value');
            const badges = badgesSnapshot.val() || [];
            document.getElementById('myBadgesDisplay').innerHTML = badges.map(b => `🏅 ${b}`).join(' ') || 'لم تحصل على شارات بعد';
        }
        
        async function loadStudentFeedback() {
            const submissionsRef = database.ref('submissions');
            const snapshot = await submissionsRef.orderByChild('studentId').equalTo(currentUser.uid).once('value');
            const submissions = [];
            snapshot.forEach((child) => {
                submissions.push({ id: child.key, ...child.val() });
            });
            submissions.reverse();
            
            if (submissions.length === 0) {
                document.getElementById('myFeedback').innerHTML = '<div class="empty-state">📭 لم ترسل أي إجابة بعد</div>';
                return;
            }
            
            let html = '';
            submissions.forEach(sub => {
                const statusIcon = sub.grade === 'correct' ? '✅' : (sub.grade === 'wrong' ? '❌' : '⏳');
                const statusText = sub.grade === 'correct' ? 'صحيح +5 نقاط' : (sub.grade === 'wrong' ? 'خطأ' : 'قيد المراجعة');
                html += `
                    <div class="feedback-item ${sub.grade === 'correct' ? 'feedback-correct' : (sub.grade === 'wrong' ? 'feedback-wrong' : 'feedback-pending')}">
                        <div class="feedback-header">
                            <span>${statusIcon} ${statusText}</span>
                            <small>${new Date(sub.timestamp).toLocaleString()}</small>
                        </div>
                        <div class="feedback-body">
                            ${sub.text ? `<div class="your-answer">📝 إجابتك: ${escapeHtml(sub.text)}</div>` : ''}
                            ${sub.imageUrl ? `<div class="your-answer">🖼️ <a href="${sub.imageUrl}" target="_blank">عرض الصورة</a></div>` : ''}
                            ${sub.feedback ? `<div class="teacher-reply"><i class="fas fa-chalkboard-teacher"></i> رد الأستاذ: ${escapeHtml(sub.feedback)}</div>` : '<div class="teacher-reply">⏳ ينتظر التصحيح...</div>'}
                        </div>
                    </div>
                `;
            });
            document.getElementById('myFeedback').innerHTML = html;
        }
        
        async function loadSchedule() {
            const snapshot = await database.ref('schedule').once('value');
            const schedule = snapshot.val() || {};
            const container = document.getElementById('studentScheduleList');
            
            if (Object.keys(schedule).length === 0) {
                container.innerHTML = '<div class="empty-state">📅 لا توجد مهام مضافة بعد</div>';
                return;
            }
            
            let html = '';
            for (let id in schedule) {
                const item = schedule[id];
                html += `
                    <div class="schedule-item">
                        <div class="schedule-time">${escapeHtml(item.time)}</div>
                        <div class="schedule-task">${escapeHtml(item.task)}</div>
                        <div>
                            <span style="background: ${item.completed ? '#059669' : '#475569'}; padding:0.2rem 0.6rem; border-radius:1rem;">${item.completed ? 'تم' : 'قادم'}</span>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }
        
        async function loadFiles() {
            const snapshot = await database.ref('files').once('value');
            const files = snapshot.val() || {};
            const container = document.getElementById('studentFilesList');
            
            if (Object.keys(files).length === 0) {
                container.innerHTML = '<div class="empty-state">📂 لا توجد ملفات مرفوعة بعد</div>';
                return;
            }
            
            let html = '';
            for (let id in files) {
                const file = files[id];
                html += `
                    <div class="file-item">
                        <div class="file-icon"><i class="fas ${file.isLink ? 'fa-link' : 'fa-file'}"></i></div>
                        <div class="file-name">${escapeHtml(file.name)}</div>
                        <div>
                            <button class="file-download" onclick="window.open('${file.url}', '_blank')">
                                <i class="fas ${file.isLink ? 'fa-external-link-alt' : 'fa-download'}"></i>
                            </button>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }
        
        // إرسال إجابة جديدة
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const answerText = document.getElementById('answerText').value.trim();
            const imageFile = document.getElementById('answerImage').files[0];
            
            if (!answerText && !imageFile) {
                alert('الرجاء كتابة إجابة أو رفع صورة');
                return;
            }
            
            const statusDiv = document.getElementById('submitStatus');
            statusDiv.innerHTML = '<span class="loading"></span> جاري الإرسال...';
            
            let imageUrl = null;
            if (imageFile) {
                statusDiv.innerHTML = '<span class="loading"></span> جاري رفع الصورة...';
                imageUrl = await uploadImageToCloudinary(imageFile);
                if (!imageUrl) {
                    statusDiv.innerHTML = '❌ فشل رفع الصورة';
                    return;
                }
            }
            
            statusDiv.innerHTML = '<span class="loading"></span> جاري حفظ الإجابة...';
            
            const newSubmission = {
                studentId: currentUser.uid,
                studentName: currentUserData.displayName,
                text: answerText,
                imageUrl: imageUrl,
                timestamp: Date.now(),
                grade: null,
                feedback: null
            };
            
            await database.ref('submissions').push(newSubmission);
            
            document.getElementById('answerText').value = '';
            document.getElementById('answerImage').value = '';
            document.getElementById('imagePreview').innerHTML = '';
            statusDiv.innerHTML = '✅ تم إرسال إجابتك بنجاح! انتظر رد الأستاذ';
            
            setTimeout(() => {
                statusDiv.innerHTML = '';
            }, 3000);
            
            loadStudentFeedback();
            
            // صوت عند الإرسال
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 660;
                gain.gain.value = 0.15;
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
                osc.stop(audioCtx.currentTime + 0.25);
            } catch(e) {}
        });
        
        // معاينة الصورة
        document.getElementById('answerImage').addEventListener('change', (e) => {
            const file = e.target.files[0];
            const preview = document.getElementById('imagePreview');
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    preview.innerHTML = `<img src="${ev.target.result}" style="max-width:100%; max-height:150px; border-radius:12px; margin-top:8px;">`;
                };
                reader.readAsDataURL(file);
            } else {
                preview.innerHTML = '';
            }
        });
        
        async function checkBroadcast() {
            const snapshot = await database.ref('broadcast').limitToLast(1).once('value');
            const broadcast = snapshot.val();
            if (broadcast) {
                const lastMsg = Object.values(broadcast)[0];
                const lastSeen = localStorage.getItem('lastBroadcastSeen') || 0;
                if (lastMsg.time > lastSeen) {
                    setTimeout(() => {
                        alert(`📢 رسالة جديدة من الأستاذ:\n\n${lastMsg.message}`);
                        localStorage.setItem('lastBroadcastSeen', lastMsg.time);
                    }, 500);
                }
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
        }
        
        setInterval(() => {
            if (currentUser) loadStudentData();
        }, 3000);
    </script>
</body>
</html>
