<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Mode - الطالب</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
        body { background: #0b1120; color: #e2e8f0; padding: 20px; }
        .container { max-width: 1300px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .btn { padding: 8px 16px; border-radius: 40px; border: none; cursor: pointer; font-weight: bold; background: #1e293b; color: white; margin: 4px; }
        .btn-primary { background: #3b82f6; }
        .btn-outline { background: transparent; border: 1px solid #3b82f6; color: #93c5fd; }
        .btn-danger { background: #dc2626; }
        .card { background: #1e293b; border-radius: 24px; padding: 20px; margin-bottom: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .timer { font-size: 48px; font-weight: bold; text-align: center; background: #0f172a; border-radius: 40px; padding: 15px; }
        .prayer-grid { display: flex; gap: 12px; flex-wrap: wrap; margin: 15px 0; }
        .prayer-item { background: #0f172a; padding: 8px 12px; border-radius: 40px; text-align: center; flex: 1; }
        .feedback-item { background: #0f172a; border-radius: 20px; padding: 12px; margin-bottom: 12px; border-right: 4px solid #3b82f6; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        input, textarea, select { background: #0f172a; border: 1px solid #334155; border-radius: 40px; padding: 10px 16px; color: white; width: 100%; margin: 6px 0; }
        .tab-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; }
        .todo-item { background: #0f172a; border-radius: 40px; padding: 10px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .completed { opacity: 0.6; text-decoration: line-through; }
        .shop-item { background: #0f172a; border-radius: 20px; padding: 12px; text-align: center; cursor: pointer; transition: 0.2s; }
        .shop-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 15px; margin-top: 15px; }
        .stat-number { font-size: 32px; font-weight: bold; color: #facc15; }
        .leaderboard-item { background: #0f172a; border-radius: 20px; padding: 10px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .rank-1 { background: linear-gradient(135deg,#fbbf24,#f59e0b); color:#1e293b; }
        hr { margin: 15px 0; border-color: #334155; }
        @media (max-width:800px){ .grid-2{ grid-template-columns:1fr; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🧑‍🎓 Focus Mode - الطالب</h1>
        <div><span id="studentNameSpan"></span> <button class="btn btn-danger" onclick="logout()">🚪 خروج</button></div>
    </div>

    <div class="tab-buttons">
        <button class="btn btn-primary" onclick="showSection('study')">📚 الدراسة</button>
        <button class="btn btn-outline" onclick="showSection('todo')">✅ مهامي</button>
        <button class="btn btn-outline" onclick="showSection('shop')">🛒 المتجر</button>
        <button class="btn btn-outline" onclick="showSection('schedule')">📅 جدولي</button>
        <button class="btn btn-outline" onclick="showSection('prayer')">🕌 الصلاة</button>
        <button class="btn btn-outline" onclick="showSection('stats')">📊 إحصائياتي</button>
        <button class="btn btn-outline" onclick="showSection('leaderboard')">🏆 المتصدرين</button>
    </div>

    <!-- الدراسة -->
    <div id="section-study" class="grid-2">
        <div class="card">
            <h3>✏️ رفع إجابتك</h3>
            <textarea id="answerText" rows="3" placeholder="اكتب حلك هنا..."></textarea>
            <input type="file" id="answerImage" accept="image/*">
            <div id="imagePreview" style="margin:8px 0;"></div>
            <button class="btn btn-primary" id="submitAnswerBtn">📤 إرسال الإجابة</button>
            <div id="submitStatus" style="margin-top:8px;"></div>
            <hr>
            <div class="flex-between"><span>⭐ نقاطي: <span id="myPoints">0</span></span><span>🏅 <span id="myBadges">لا شارات</span></span></div>
        </div>
        <div class="card">
            <h3>💬 ردود الأستاذ</h3>
            <div id="feedbackList"></div>
        </div>
    </div>

    <!-- المهام -->
    <div id="section-todo" style="display:none;">
        <div class="card"><h3>✅ قائمة مهامي</h3><div id="todoList"></div><div class="flex-between"><input type="text" id="newTodo" placeholder="مهمة جديدة..."><button class="btn btn-primary" onclick="addTodo()">➕ أضف</button></div></div>
    </div>

    <!-- المتجر -->
    <div id="section-shop" style="display:none;">
        <div class="card"><h3>🛒 متجر النقاط</h3><div id="shopItems" class="shop-items"></div></div>
    </div>

    <!-- جدول -->
    <div id="section-schedule" style="display:none;">
        <div class="card"><h3>📅 جدول المذاكرة</h3><div id="studentSchedule"></div></div>
    </div>

    <!-- الصلاة والتركيز -->
    <div id="section-prayer" style="display:none;">
        <div class="card"><h3>🕌 أوقات الصلاة</h3><div id="prayerTimes" class="prayer-grid"></div><div id="nextPrayerMsg"></div></div>
        <div class="card"><h3>🧘 مؤقت تركيز</h3><div class="timer" id="focusTimer">25:00</div><div><input type="number" id="focusMinutes" value="25"> دقيقة</div><div><button class="btn btn-primary" id="focusStart">ابدأ</button><button class="btn btn-outline" id="focusPause">إيقاف</button><button class="btn btn-outline" id="focusReset">إعادة</button></div></div>
    </div>

    <!-- إحصائيات -->
    <div id="section-stats" style="display:none;">
        <div class="card"><h3>📊 إحصائياتي</h3><div id="statsBox"></div></div>
    </div>

    <!-- متصدرين -->
    <div id="section-leaderboard" style="display:none;">
        <div class="card"><h3>🏆 لوحة المتصدرين</h3><div id="leaderboardBox"></div></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCFydOV8EjlhD4AASTZFU1keYA3I6UQHyw",
        authDomain: "foucsmode-95e4f.firebaseapp.com",
        projectId: "foucsmode-95e4f",
        storageBucket: "foucsmode-95e4f.firebasestorage.app",
        messagingSenderId: "972730357334",
        appId: "1:972730357334:web:f2d3044a7c8eed588b8df7"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    let currentUser = null, currentUserId = null, currentStudentData = null;

    auth.onAuthStateChanged(async (u) => {
        if (!u) { window.location.href = "login.html"; return; }
        currentUserId = u.uid;
        const snap = await db.ref(`users/${currentUserId}`).once("value");
        currentStudentData = snap.val();
        if (!currentStudentData || currentStudentData.role !== "student") { window.location.href = "login.html"; return; }
        document.getElementById("studentNameSpan").innerHTML = `👋 مرحباً ${currentStudentData.displayName}`;
        loadAll();
    });

    function logout() { auth.signOut().then(() => window.location.href = "login.html"); }
    function showSection(section) {
        document.querySelectorAll("[id^='section-']").forEach(el => el.style.display = "none");
        document.getElementById(`section-${section}`).style.display = "grid";
        if (section === "todo") loadTodos();
        if (section === "shop") loadShop();
        if (section === "schedule") loadSchedule();
        if (section === "prayer") { loadPrayerTimes(); initFocusTimer(); }
        if (section === "stats") loadStats();
        if (section === "leaderboard") loadLeaderboard();
    }

    async function loadAll() {
        loadPointsAndBadges();
        loadFeedbacks();
        loadTodos();
        loadShop();
        loadSchedule();
        loadPrayerTimes();
        loadStats();
        loadLeaderboard();
        setInterval(() => { if (document.getElementById("section-study").style.display === "grid") loadFeedbacks(); }, 5000);
    }

    async function loadPointsAndBadges() {
        let snap = await db.ref(`users/${currentUserId}/points`).once("value");
        let points = snap.val() || 0;
        document.getElementById("myPoints").innerText = points;
        let badgesSnap = await db.ref(`users/${currentUserId}/badges`).once("value");
        let badges = badgesSnap.val() || [];
        document.getElementById("myBadges").innerHTML = badges.map(b=>`🏅 ${b}`).join(" ") || "لا شارات";
    }

    async function loadFeedbacks() {
        let snap = await db.ref("submissions").orderByChild("studentId").equalTo(currentUserId).once("value");
        let subs = [];
        snap.forEach(s => subs.push(s.val()));
        subs.reverse();
        let container = document.getElementById("feedbackList");
        if (!subs.length) { container.innerHTML = "<div class='card'>📭 لم ترسل أي إجابات بعد</div>"; return; }
        let html = "";
        subs.forEach(sub => {
            let status = sub.grade === "correct" ? "✅ صحيح" : (sub.grade === "wrong" ? "❌ خطأ" : "⏳ قيد المراجعة");
            let color = sub.grade === "correct" ? "#10b981" : (sub.grade === "wrong" ? "#dc2626" : "#f59e0b");
            html += `<div class="feedback-item" style="border-right-color:${color}"><div class="flex-between"><span>${status}</span><small>${new Date(sub.timestamp).toLocaleString()}</small></div><div>${sub.text ? `📝 ${escapeHtml(sub.text)}` : ""} ${sub.imageUrl ? `<a href="${sub.imageUrl}" target="_blank">🖼️ صورة</a>` : ""}</div>${sub.feedback ? `<div>📩 ${escapeHtml(sub.feedback)}</div>` : ""}</div>`;
        });
        container.innerHTML = html;
    }

    async function uploadImage(file) {
        let fd = new FormData();
        fd.append("file", file);
        fd.append("upload_preset", "focus_mode_preset");
        fd.append("cloud_name", "dt1lrpvhq");
        let res = await fetch("https://api.cloudinary.com/v1_1/dt1lrpvhq/image/upload", { method: "POST", body: fd });
        let data = await res.json();
        return data.secure_url;
    }

    document.getElementById("submitAnswerBtn").addEventListener("click", async () => {
        let text = document.getElementById("answerText").value.trim();
        let file = document.getElementById("answerImage").files[0];
        if (!text && !file) { alert("اكتب إجابة أو ارفع صورة"); return; }
        let statusDiv = document.getElementById("submitStatus");
        statusDiv.innerText = "⏳ جاري الإرسال...";
        let imgUrl = null;
        if (file) { imgUrl = await uploadImage(file); if (!imgUrl) { statusDiv.innerText = "❌ فشل رفع الصورة"; return; } }
        await db.ref("submissions").push({ studentId: currentUserId, studentName: currentStudentData.displayName, text, imageUrl: imgUrl, timestamp: Date.now(), grade: null, feedback: null });
        document.getElementById("answerText").value = "";
        document.getElementById("answerImage").value = "";
        document.getElementById("imagePreview").innerHTML = "";
        statusDiv.innerText = "✅ تم الإرسال! انتظر رد الأستاذ";
        setTimeout(() => statusDiv.innerText = "", 3000);
        loadFeedbacks();
    });
    document.getElementById("answerImage").addEventListener("change", (e) => {
        let file = e.target.files[0];
        let preview = document.getElementById("imagePreview");
        if (file) { let reader = new FileReader(); reader.onload = ev => preview.innerHTML = `<img src="${ev.target.result}" style="max-width:150px; border-radius:16px;">`; reader.readAsDataURL(file); }
        else preview.innerHTML = "";
    });

    // مهام
    async function loadTodos() {
        let snap = await db.ref(`todos/${currentUserId}`).once("value");
        let todos = snap.val() || [];
        let container = document.getElementById("todoList");
        if (!todos.length) { container.innerHTML = "<div class='card'>📝 لا توجد مهام</div>"; return; }
        let html = "";
        todos.forEach((t,idx) => {
            html += `<div class="todo-item ${t.completed ? 'completed' : ''}"><span>${escapeHtml(t.text)}</span><div><input type="checkbox" ${t.completed ? "checked" : ""} onchange="toggleComplete(${idx})"> <button class="btn btn-danger" style="padding:4px 12px;" onclick="deleteTodo(${idx})">🗑️</button></div></div>`;
        });
        container.innerHTML = html;
    }
    window.addTodo = async () => {
        let txt = document.getElementById("newTodo").value.trim();
        if (!txt) return;
        let snap = await db.ref(`todos/${currentUserId}`).once("value");
        let todos = snap.val() || [];
        todos.push({ text: txt, completed: false });
        await db.ref(`todos/${currentUserId}`).set(todos);
        document.getElementById("newTodo").value = "";
        loadTodos();
    };
    window.toggleComplete = async (idx) => {
        let snap = await db.ref(`todos/${currentUserId}`).once("value");
        let todos = snap.val() || [];
        if (todos[idx]) { todos[idx].completed = !todos[idx].completed; await db.ref(`todos/${currentUserId}`).set(todos); loadTodos(); }
    };
    window.deleteTodo = async (idx) => {
        let snap = await db.ref(`todos/${currentUserId}`).once("value");
        let todos = snap.val() || [];
        todos.splice(idx, 1);
        await db.ref(`todos/${currentUserId}`).set(todos);
        loadTodos();
    };

    // متجر بسيط
    const shopList = [
        { id: "sticker1", name: "🌟 ملصق نجم", price: 10, icon: "⭐" },
        { id: "sticker2", name: "🎓 ملصق متخرج", price: 25, icon: "🎓" },
        { id: "title1", name: "🏅 لقب: مجتهد", price: 50, icon: "📚" },
        { id: "title2", name: "🧠 لقب: عبقري", price: 100, icon: "🧠" }
    ];
    async function loadShop() {
        let pointsSnap = await db.ref(`users/${currentUserId}/points`).once("value");
        let points = pointsSnap.val() || 0;
        let purchasedSnap = await db.ref(`users/${currentUserId}/purchased`).once("value");
        let purchased = purchasedSnap.val() || [];
        let html = "";
        shopList.forEach(item => {
            let owned = purchased.includes(item.id);
            html += `<div class="shop-item" onclick="${owned ? "" : `buyItem('${item.id}',${item.price})`}" style="${owned ? "opacity:0.6" : "cursor:pointer"}"><div>${item.icon}</div><div>${item.name}</div><div>💰 ${item.price}</div>${owned ? "<div>✅ مملوك</div>" : ""}</div>`;
        });
        document.getElementById("shopItems").innerHTML = html;
    }
    window.buyItem = async (id, price) => {
        let pointsSnap = await db.ref(`users/${currentUserId}/points`).once("value");
        let points = pointsSnap.val() || 0;
        if (points < price) { alert("❌ نقاطك غير كافية"); return; }
        let purchasedSnap = await db.ref(`users/${currentUserId}/purchased`).once("value");
        let purchased = purchasedSnap.val() || [];
        if (purchased.includes(id)) { alert("لقد اشتريت هذا بالفعل"); return; }
        purchased.push(id);
        await db.ref(`users/${currentUserId}`).update({ points: points - price, purchased });
        alert("✅ تم الشراء!");
        loadPointsAndBadges();
        loadShop();
    };

    async function loadSchedule() {
        let snap = await db.ref("weekly_schedule").once("value");
        let data = snap.val() || {};
        let days = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
        let html = "";
        for (let day of days) {
            if (data[day] && data[day].length) {
                html += `<div class="card"><strong>📅 ${day}</strong>`;
                data[day].forEach(t => html += `<div>⏰ ${escapeHtml(t.time)} - ${escapeHtml(t.task)}</div>`);
                html += `</div>`;
            }
        }
        if (!html) html = "<div class='card'>📭 لا توجد مهام</div>";
        document.getElementById("studentSchedule").innerHTML = html;
    }

    async function loadPrayerTimes() {
        try {
            let d = new Date(), url = `https://api.aladhan.com/v1/timings/${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}?latitude=24.4539&longitude=54.3773&method=8&timezonestring=Asia/Dubai`;
            let res = await fetch(url), data = await res.json();
            if (data.code === 200) {
                let t = data.data.timings;
                let prayers = ["Fajr","Dhuhr","Asr","Maghrib","Isha"];
                let names = ["الفجر","الظهر","العصر","المغرب","العشاء"];
                let html = "";
                for (let i=0;i<prayers.length;i++) html += `<div class="prayer-item"><div>${names[i]}</div><div>${t[prayers[i]]}</div></div>`;
                document.getElementById("prayerTimes").innerHTML = html;
                let nowMin = new Date().getHours()*60 + new Date().getMinutes();
                let next = null, minDiff = Infinity;
                for (let i=0;i<prayers.length;i++) {
                    let [h,m] = t[prayers[i]].split(":"); let pm = parseInt(h)*60+parseInt(m);
                    let diff = pm - nowMin;
                    if (diff > 0 && diff < minDiff) { minDiff = diff; next = names[i]; }
                }
                if (!next) { let [h,m] = t["Fajr"].split(":"); minDiff = (24*60-nowMin)+(parseInt(h)*60+parseInt(m)); next = "الفجر"; }
                document.getElementById("nextPrayerMsg").innerHTML = `🕋 الصلاة القادمة: ${next} بعد ${Math.floor(minDiff/60)} س و ${minDiff%60} د`;
            }
        } catch(e) { console.warn(e); }
    }

    let focusInterval = null, focusTime = 25*60, focusRunning = false;
    const focusTimerEl = document.getElementById("focusTimer");
    function updateFocusTimer() { let m = Math.floor(focusTime/60), s = focusTime%60; focusTimerEl.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }
    function startFocus() { if (focusRunning) return; if (focusInterval) clearInterval(focusInterval); focusInterval = setInterval(() => { if (focusTime > 0) { focusTime--; updateFocusTimer(); } else { clearInterval(focusInterval); focusRunning = false; alert("✅ انتهى وقت التركيز!"); } }, 1000); focusRunning = true; }
    function pauseFocus() { if (focusInterval) clearInterval(focusInterval); focusRunning = false; }
    function resetFocus() { pauseFocus(); let mins = parseInt(document.getElementById("focusMinutes").value)||25; focusTime = mins*60; updateFocusTimer(); }
    function initFocusTimer() {
        document.getElementById("focusStart")?.addEventListener("click", startFocus);
        document.getElementById("focusPause")?.addEventListener("click", pauseFocus);
        document.getElementById("focusReset")?.addEventListener("click", resetFocus);
        resetFocus();
    }

    async function loadStats() {
        let subsSnap = await db.ref("submissions").orderByChild("studentId").equalTo(currentUserId).once("value");
        let subs = []; subsSnap.forEach(s => subs.push(s.val()));
        let total = subs.length, correct = subs.filter(s=>s.grade==="correct").length, wrong = subs.filter(s=>s.grade==="wrong").length, rate = total ? Math.round((correct/total)*100) : 0;
        let pointsSnap = await db.ref(`users/${currentUserId}/points`).once("value");
        let points = pointsSnap.val() || 0;
        document.getElementById("statsBox").innerHTML = `<div class="card">📝 إجمالي الإجابات: ${total}</div><div class="card">✅ إجابات صحيحة: ${correct}</div><div class="card">❌ إجابات خاطئة: ${wrong}</div><div class="card">📊 نسبة النجاح: ${rate}%</div><div class="card">⭐ نقاطك: ${points}</div>`;
    }

    async function loadLeaderboard() {
        let usersSnap = await db.ref("users").once("value");
        let students = Object.values(usersSnap.val()||{}).filter(u=>u.role==="student");
        students.sort((a,b)=>(b.points||0)-(a.points||0));
        let html = "";
        students.forEach((s,i) => {
            let rank = i===0?"rank-1":(i===1?"rank-2":(i===2?"rank-3":""));
            html += `<div class="leaderboard-item ${rank}"><div><strong>${i+1}.</strong> ${escapeHtml(s.displayName)}</div><div>⭐ ${s.points||0}</div></div>`;
        });
        if (!html) html = "<div class='card'>🏆 لا نقاط بعد</div>";
        document.getElementById("leaderboardBox").innerHTML = html;
    }

    function escapeHtml(str) { if (!str) return ""; return str.replace(/[&<>]/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;" })[m]); }

    // start
    showSection("study");
</script>
</body>
</html>
