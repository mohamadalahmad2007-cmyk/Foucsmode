<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Mode - المدير (بسيطة وشغالة)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
        body { background: #0b1120; color: #e2e8f0; padding: 20px; }
        .container { max-width: 1300px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn { padding: 6px 14px; border-radius: 30px; border: none; cursor: pointer; font-weight: bold; background: #1e293b; color: white; margin: 4px; }
        .btn-primary { background: #3b82f6; }
        .btn-outline { background: transparent; border: 1px solid #3b82f6; color: #93c5fd; }
        .btn-danger { background: #dc2626; }
        .btn-success { background: #10b981; }
        .grid-2 { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .card { background: #1e293b; border-radius: 24px; padding: 20px; margin-bottom: 20px; }
        .timer { font-size: 48px; font-weight: bold; text-align: center; background: #0f172a; border-radius: 40px; padding: 15px; margin: 10px 0; }
        .prayer-grid { display: flex; gap: 12px; flex-wrap: wrap; margin: 15px 0; }
        .prayer-item { background: #0f172a; padding: 8px 12px; border-radius: 40px; text-align: center; flex: 1; }
        .answer-card { background: #0f172a; border-radius: 20px; padding: 12px; margin-bottom: 12px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .badge-correct { background: #10b981; padding: 2px 12px; border-radius: 30px; font-size: 12px; }
        .badge-wrong { background: #dc2626; padding: 2px 12px; border-radius: 30px; font-size: 12px; }
        .badge-pending { background: #f59e0b; padding: 2px 12px; border-radius: 30px; font-size: 12px; }
        .btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        input, textarea, select { background: #0f172a; border: 1px solid #334155; border-radius: 40px; padding: 8px 16px; color: white; width: 100%; margin: 6px 0; }
        .tab-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; }
        .schedule-day { background: #0f172a; border-radius: 16px; padding: 12px; margin-bottom: 12px; }
        .file-item, .student-item, .leaderboard-item { background: #0f172a; border-radius: 16px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        hr { margin: 15px 0; border-color: #334155; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🧑‍💼 لوحة المدير - Focus Mode</h1>
        <button class="btn btn-danger" onclick="logoutNow()">🚪 تسجيل خروج</button>
    </div>

    <!-- أزرار التبويبات -->
    <div class="tab-buttons">
        <button class="btn btn-primary" onclick="showTab('answers')">📝 الإجابات</button>
        <button class="btn btn-outline" onclick="showTab('quiz')">📚 بنك الأسئلة</button>
        <button class="btn btn-outline" onclick="showTab('schedule')">📅 جدول أسبوعي</button>
        <button class="btn btn-outline" onclick="showTab('students')">👥 الطلاب</button>
        <button class="btn btn-outline" onclick="showTab('stats')">📊 إحصائيات</button>
        <button class="btn btn-outline" onclick="showTab('leaderboard')">🏆 المتصدرين</button>
    </div>

    <!-- تبويب الإجابات -->
    <div id="tab-answers" class="grid-2">
        <div class="card">
            <h3>⏱️ مؤقت الدراسة</h3>
            <div class="timer" id="timerDisplay">25:00</div>
            <div><input type="number" id="minutesInput" value="25" style="width:100px;"> دقيقة</div>
            <div>
                <button class="btn btn-primary" id="startBtn">▶️ بدء</button>
                <button class="btn btn-outline" id="pauseBtn">⏸️ إيقاف</button>
                <button class="btn btn-outline" id="resetBtn">🔄 إعادة</button>
            </div>
            <hr>
            <h3>🕌 أوقات الصلاة (أبوظبي)</h3>
            <div id="prayerTimes" class="prayer-grid"></div>
            <div id="nextPrayer" class="card" style="margin-top:10px;"></div>
        </div>
        <div class="card">
            <h3>📬 إجابات الطلاب</h3>
            <input type="text" id="searchInput" placeholder="🔍 بحث في الإجابات">
            <div id="answersList"></div>
            <hr>
            <textarea id="broadcastMsg" rows="2" placeholder="📢 رسالة جماعية للطلاب"></textarea>
            <button class="btn btn-primary" onclick="sendBroadcastNow()">📢 إرسال للجميع</button>
        </div>
    </div>

    <!-- تبويب الأسئلة -->
    <div id="tab-quiz" style="display:none;">
        <div class="card">
            <h3>📝 إضافة سؤال جديد</h3>
            <input type="text" id="newQuestion" placeholder="السؤال">
            <input type="text" id="opt0" placeholder="الخيار 1">
            <input type="text" id="opt1" placeholder="الخيار 2">
            <input type="text" id="opt2" placeholder="الخيار 3">
            <input type="text" id="opt3" placeholder="الخيار 4">
            <input type="number" id="correctIdx" placeholder="رقم الإجابة الصحيحة (1-4)">
            <button class="btn btn-primary" onclick="addQuestion()">➕ إضافة السؤال</button>
            <hr>
            <button class="btn btn-success" onclick="publishAll()">📢 نشر جميع الأسئلة للطلاب</button>
            <hr>
            <h3>📋 قائمة الأسئلة</h3>
            <div id="questionsList"></div>
        </div>
    </div>

    <!-- تبويب الجدول الأسبوعي -->
    <div id="tab-schedule" style="display:none;">
        <div class="card">
            <h3>📅 إضافة مهمة أسبوعية</h3>
            <select id="weekDay"><option>الأحد</option><option>الإثنين</option><option>الثلاثاء</option><option>الأربعاء</option><option>الخميس</option><option>الجمعة</option><option>السبت</option></select>
            <input type="text" id="taskTime" placeholder="الوقت (مثال 10:00 ص)">
            <input type="text" id="taskName" placeholder="المهمة">
            <button class="btn btn-primary" onclick="addSchedule()">➕ إضافة</button>
            <hr>
            <div id="scheduleList"></div>
        </div>
    </div>

    <!-- تبويب الطلاب -->
    <div id="tab-students" style="display:none;">
        <div class="card"><h3>👥 قائمة الطلاب</h3><div id="studentsList"></div></div>
    </div>

    <!-- تبويب الإحصائيات -->
    <div id="tab-stats" style="display:none;">
        <div class="card"><h3>📊 إحصائيات عامة</h3><div id="statsBox"></div></div>
    </div>

    <!-- تبويب المتصدرين -->
    <div id="tab-leaderboard" style="display:none;">
        <div class="card"><h3>🏆 لوحة المتصدرين</h3><div id="leaderboardBox"></div></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script>
    // --------------------- Firebase config ---------------------
    const firebaseConfig = {
        apiKey: "AIzaSyCFydOV8EjlhD4AASTZFU1keYA3I6UQHyw",
        authDomain: "foucsmode-95e4f.firebaseapp.com",
        projectId: "foucsmode-95e4f",
        storageBucket: "foucsmode-95e4f.firebasestorage.app",
        messagingSenderId: "972730357334",
        appId: "1:972730357334:web:f2d3044a7c8eed588b8df7"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    let currentUser = null;
    // --------------------- Auth ---------------------
    auth.onAuthStateChanged(async (user) => {
        if (!user) { window.location.href = "login.html"; return; }
        currentUser = user;
        const snap = await db.ref(`users/${user.uid}`).once("value");
        const role = snap.val()?.role;
        if (role !== "admin") { window.location.href = "login.html"; return; }
        loadAll();
    });

    function loadAll() {
        loadSubmissions(); loadPrayerTimes(); loadQuestions(); loadSchedule(); loadStudents(); loadStats(); loadLeaderboard();
        setInterval(() => { if (document.getElementById("tab-answers").style.display !== "none") loadSubmissions(); }, 4000);
        setInterval(loadPrayerTimes, 60000);
    }

    function logoutNow() { auth.signOut().then(() => window.location.href = "login.html"); }

    // --------------------- تَبويبات ---------------------
    function showTab(tab) {
        document.querySelectorAll("[id^='tab-']").forEach(el => el.style.display = "none");
        document.getElementById(`tab-${tab}`).style.display = tab==="answers"?"grid":"block";
        if (tab === "quiz") loadQuestions();
        if (tab === "schedule") loadSchedule();
        if (tab === "students") loadStudents();
        if (tab === "stats") loadStats();
        if (tab === "leaderboard") loadLeaderboard();
    }

    // --------------------- مؤقت ---------------------
    let timeLeft = 25*60, timerInterval = null;
    const timerEl = document.getElementById("timerDisplay");
    function updateTimerDisplay() { let m = Math.floor(timeLeft/60), s = timeLeft%60; timerEl.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }
    function startTimer() { if (timerInterval) clearInterval(timerInterval); timerInterval = setInterval(() => { if (timeLeft>0) { timeLeft--; updateTimerDisplay(); } else { clearInterval(timerInterval); alert("⏰ انتهى الوقت!"); } }, 1000); }
    function pauseTimer() { if (timerInterval) clearInterval(timerInterval); timerInterval = null; }
    function resetTimer() { pauseTimer(); let mins = parseInt(document.getElementById("minutesInput").value)||25; timeLeft = mins*60; updateTimerDisplay(); }
    document.getElementById("startBtn")?.addEventListener("click", startTimer);
    document.getElementById("pauseBtn")?.addEventListener("click", pauseTimer);
    document.getElementById("resetBtn")?.addEventListener("click", resetTimer);
    resetTimer();

    // --------------------- أوقات الصلاة ---------------------
    async function loadPrayerTimes() {
        try {
            let d = new Date(), url = `https://api.aladhan.com/v1/timings/${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}?latitude=24.4539&longitude=54.3773&method=8&timezonestring=Asia/Dubai`;
            let res = await fetch(url), data = await res.json();
            if (data.code === 200) {
                let timings = data.data.timings;
                let prayers = ["Fajr","Dhuhr","Asr","Maghrib","Isha"];
                let names = ["الفجر","الظهر","العصر","المغرب","العشاء"];
                let html = "";
                for (let i=0;i<prayers.length;i++) html += `<div class="prayer-item"><div>${names[i]}</div><div>${timings[prayers[i]]}</div></div>`;
                document.getElementById("prayerTimes").innerHTML = html;
                // الوقت المتبقي
                let now = new Date(), nowMin = now.getHours()*60+now.getMinutes();
                let nextTime = null, minDiff = Infinity;
                for (let i=0;i<prayers.length;i++) {
                    let [h,m] = timings[prayers[i]].split(":");
                    let pm = parseInt(h)*60+parseInt(m);
                    let diff = pm - nowMin;
                    if (diff > 0 && diff < minDiff) { minDiff = diff; nextTime = names[i]; }
                }
                if (!nextTime) { let [h,m] = timings["Fajr"].split(":"); minDiff = (24*60-nowMin)+(parseInt(h)*60+parseInt(m)); nextTime = "الفجر"; }
                document.getElementById("nextPrayer").innerHTML = `🕋 الصلاة القادمة: ${nextTime} بعد ${Math.floor(minDiff/60)} س و ${minDiff%60} د`;
            }
        } catch(e) { console.warn(e); }
    }

    // --------------------- الإجابات ---------------------
    let allSubmissions = [];
    async function loadSubmissions() {
        let snap = await db.ref("submissions").once("value");
        let data = snap.val()||{};
        allSubmissions = Object.entries(data).map(([id,val])=>({id,...val})).reverse();
        renderAnswers();
    }
    function renderAnswers() {
        let search = document.getElementById("searchInput")?.value.toLowerCase()||"";
        let filtered = allSubmissions.filter(s=>s.studentName?.toLowerCase().includes(search)||s.text?.toLowerCase().includes(search));
        let container = document.getElementById("answersList");
        if (!filtered.length) { container.innerHTML = "<div class='card'>✨ لا إجابات حالياً</div>"; return; }
        let html = "";
        filtered.forEach(sub => {
            let badge = sub.grade==="correct"?"<span class='badge-correct'>✓ صحيح +5</span>":(sub.grade==="wrong"?"<span class='badge-wrong'>✗ خطأ</span>":"<span class='badge-pending'>⏳ قيد المراجعة</span>");
            html += `<div class="answer-card">
                <div class="flex-between"><div><strong>${escapeHtml(sub.studentName)}</strong> <small>${new Date(sub.timestamp).toLocaleString()}</small></div>${badge}</div>
                <div>${sub.text?escapeHtml(sub.text):""} ${sub.imageUrl?`<a href="${sub.imageUrl}" target="_blank">🖼️ صورة</a>`:""}</div>
                <div>${sub.feedback?`📩 ${escapeHtml(sub.feedback)}`:""}</div>
                <div class="btns">
                    <button class="btn btn-success" onclick="gradeSub('${sub.id}','correct')">✔️ صحيح</button>
                    <button class="btn btn-danger" onclick="gradeSub('${sub.id}','wrong')">❌ خطأ</button>
                    <button class="btn" onclick="sendMsgToStudent('${sub.id}')">💬 رسالة</button>
                    <button class="btn btn-danger" onclick="deleteSub('${sub.id}')">🗑️ حذف</button>
                </div>
            </div>`;
        });
        container.innerHTML = html;
    }
    window.gradeSub = async (id, grade) => {
        let subRef = db.ref(`submissions/${id}`);
        let sub = (await subRef.once("value")).val();
        if (!sub) return;
        let msg = grade==="correct"?"✅ أحسنت! +5 نقاط":"❌ حاول مرة أخرى";
        await subRef.update({ grade, feedback: msg });
        if (grade==="correct") {
            let pointsRef = db.ref(`users/${sub.studentId}/points`);
            let cur = (await pointsRef.once("value")).val()||0;
            await pointsRef.set(cur+5);
        }
        loadSubmissions();
    };
    window.sendMsgToStudent = async (id) => {
        let msg = prompt("📝 أكتب رسالتك للطالب:");
        if (msg) await db.ref(`submissions/${id}`).update({ feedback: msg });
        loadSubmissions();
    };
    window.deleteSub = async (id) => { if (confirm("حذف الإجابة؟")) { await db.ref(`submissions/${id}`).remove(); loadSubmissions(); } };
    window.sendBroadcastNow = async () => {
        let msg = document.getElementById("broadcastMsg").value.trim();
        if (!msg) return alert("اكتب رسالة");
        await db.ref("broadcast").push({ message: msg, time: Date.now() });
        alert("✅ أرسلت للجميع");
        document.getElementById("broadcastMsg").value = "";
    };
    function escapeHtml(str) { if (!str) return ""; return str.replace(/[&<>]/g, m => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" })[m]); }

    // --------------------- الأسئلة ---------------------
    let questions = [];
    async function loadQuestions() {
        let snap = await db.ref("quiz").once("value");
        questions = Object.entries(snap.val()||{}).map(([id,q])=>({id,...q}));
        let cont = document.getElementById("questionsList");
        if (!questions.length) { cont.innerHTML = "<div class='card'>📭 لا توجد أسئلة بعد</div>"; return; }
        let html = "";
        questions.forEach((q,i) => {
            html += `<div class="answer-card"><div><strong>سؤال ${i+1}:</strong> ${escapeHtml(q.question)}</div><div>${(q.options||[]).map((opt,idx)=>`${idx+1}- ${opt} ${idx===q.correct?"✅":""}`).join(" | ")}</div><div>⏱️ ${q.time||30} ث | ⭐ ${q.points||5}</div><div class="btns"><button class="btn btn-primary" onclick="editQuestionPrompt('${q.id}')">✏️ تعديل</button><button class="btn btn-danger" onclick="deleteQuestion('${q.id}')">🗑️ حذف</button></div></div>`;
        });
        cont.innerHTML = html;
    }
    window.addQuestion = () => {
        let q = document.getElementById("newQuestion").value.trim();
        let opts = [document.getElementById("opt0").value.trim(), document.getElementById("opt1").value.trim(), document.getElementById("opt2").value.trim(), document.getElementById("opt3").value.trim()].filter(o=>o);
        let correct = parseInt(document.getElementById("correctIdx").value)-1;
        if (!q || opts.length<2 || isNaN(correct)) { alert("املأ السؤال و الخيارات و الرقم الصحيح"); return; }
        db.ref("quiz").push({ question: q, options: opts, correct, published: false, time: 30, points: 5 });
        alert("✅ تمت الإضافة");
        document.getElementById("newQuestion").value = ""; ["opt0","opt1","opt2","opt3","correctIdx"].forEach(id=>document.getElementById(id).value="");
        loadQuestions();
    };
    window.publishAll = async () => {
        let all = questions;
        if (!all.length) return alert("لا توجد أسئلة");
        for (let q of all) await db.ref(`quiz/${q.id}`).update({ published: true });
        alert("✅ تم نشر جميع الأسئلة للطلاب");
        loadQuestions();
    };
    window.deleteQuestion = async (id) => { if (confirm("حذف السؤال؟")) { await db.ref(`quiz/${id}`).remove(); loadQuestions(); } };
    window.editQuestionPrompt = async (id) => {
        let q = questions.find(qq=>qq.id===id);
        if (!q) return;
        let newQ = prompt("السؤال الجديد:", q.question);
        if (!newQ) return;
        let newOpts = prompt("الخيارات مفصولة بفاصلة:", q.options.join(","));
        if (!newOpts) return;
        let newCorrect = prompt("رقم الإجابة الصحيحة (1-4):", (q.correct+1));
        await db.ref(`quiz/${id}`).update({ question: newQ, options: newOpts.split(","), correct: parseInt(newCorrect)-1 });
        loadQuestions();
    };

    // --------------------- جدول أسبوعي ---------------------
    async function loadSchedule() {
        let snap = await db.ref("weekly_schedule").once("value");
        let data = snap.val()||{};
        let days = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
        let html = "";
        for (let day of days) {
            if (data[day] && data[day].length) {
                html += `<div class="schedule-day"><div><strong>📅 ${day}</strong></div>`;
                data[day].forEach((t,idx)=> { html += `<div class="flex-between"><span>⏰ ${escapeHtml(t.time)} - ${escapeHtml(t.task)}</span><button class="btn btn-danger btn-sm" onclick="deleteTask('${day}',${idx})">🗑️</button></div>`; });
                html += `</div>`;
            }
        }
        if (!html) html = "<div class='card'>📭 لا توجد مهام</div>";
        document.getElementById("scheduleList").innerHTML = html;
    }
    window.addSchedule = async () => {
        let day = document.getElementById("weekDay").value;
        let time = document.getElementById("taskTime").value.trim();
        let task = document.getElementById("taskName").value.trim();
        if (!time || !task) { alert("أدخل الوقت والمهمة"); return; }
        let ref = db.ref(`weekly_schedule/${day}`);
        let arr = (await ref.once("value")).val()||[];
        arr.push({ time, task });
        await ref.set(arr);
        loadSchedule();
    };
    window.deleteTask = async (day, idx) => {
        let ref = db.ref(`weekly_schedule/${day}`);
        let arr = (await ref.once("value")).val()||[];
        arr.splice(idx,1);
        await ref.set(arr);
        loadSchedule();
    };

    // --------------------- الطلاب ---------------------
    async function loadStudents() {
        let snap = await db.ref("users").once("value");
        let users = snap.val()||{};
        let students = Object.entries(users).filter(([_,u])=>u.role==="student").map(([id,u])=>({id,...u}));
        let html = "";
        for (let s of students) html += `<div class="student-item"><div><strong>${escapeHtml(s.displayName)}</strong><br>${s.email}<br>⭐ ${s.points||0}</div><button class="btn btn-danger" onclick="deleteStudent('${s.id}')">🗑️ حذف</button></div>`;
        if (!html) html = "<div class='card'>👥 لا طلاب</div>";
        document.getElementById("studentsList").innerHTML = html;
    }
    window.deleteStudent = async (uid) => { if (confirm("حذف الطالب نهائياً؟")) { await db.ref(`users/${uid}`).remove(); loadStudents(); } };

    // --------------------- إحصائيات ---------------------
    async function loadStats() {
        let subs = await db.ref("submissions").once("value");
        let submissions = Object.values(subs.val()||{});
        let correct = submissions.filter(s=>s.grade==="correct").length;
        let total = submissions.length;
        let rate = total?Math.round((correct/total)*100):0;
        let usersSnap = await db.ref("users").once("value");
        let students = Object.values(usersSnap.val()||{}).filter(u=>u.role==="student");
        let totalPoints = students.reduce((sum,s)=>sum+(s.points||0),0);
        document.getElementById("statsBox").innerHTML = `
            <div class="card">👥 عدد الطلاب: ${students.length}</div>
            <div class="card">📝 إجمالي الإجابات: ${total}</div>
            <div class="card">✅ نسبة الإجابات الصحيحة: ${rate}%</div>
            <div class="card">⭐ مجموع النقاط: ${totalPoints}</div>
        `;
    }

    // --------------------- لوحة المتصدرين ---------------------
    async function loadLeaderboard() {
        let usersSnap = await db.ref("users").once("value");
        let students = Object.values(usersSnap.val()||{}).filter(u=>u.role==="student");
        students.sort((a,b)=>(b.points||0)-(a.points||0));
        let html = "";
        students.forEach((s,i)=> {
            html += `<div class="leaderboard-item"><div><strong>${i+1}.</strong> ${escapeHtml(s.displayName)}</div><div>⭐ ${s.points||0}</div></div>`;
        });
        if (!html) html = "<div class='card'>🏆 لا توجد نقاط بعد</div>";
        document.getElementById("leaderboardBox").innerHTML = html;
    }
</script>
</body>
</html>
