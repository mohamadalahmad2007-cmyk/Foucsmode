<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Mode - المدير</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui; }
        body { background: linear-gradient(135deg, #0f172a, #1e1b4b); color: #e2e8f0; padding: 20px; min-height: 100vh; }
        .container { max-width: 1400px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; background: rgba(15, 25, 45, 0.5); backdrop-filter: blur(10px); padding: 15px 25px; border-radius: 2rem; }
        .btn { padding: 8px 18px; border-radius: 40px; border: none; cursor: pointer; font-weight: 600; background: #1e293b; color: white; margin: 4px; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-size: 0.9rem; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #8b5cf6); box-shadow: 0 4px 12px rgba(59,130,246,0.3); }
        .btn-outline { background: transparent; border: 1px solid #8b5cf6; color: #c084fc; }
        .btn-danger { background: linear-gradient(135deg, #dc2626, #ef4444); }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-sm { padding: 5px 12px; font-size: 0.75rem; }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
        .grid-2 { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .card { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(8px); border-radius: 1.5rem; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid rgba(255,255,255,0.05); }
        .timer { font-size: 48px; font-weight: bold; text-align: center; background: #0f172a; border-radius: 60px; padding: 15px; margin: 10px 0; font-family: monospace; letter-spacing: 5px; }
        .prayer-grid { display: flex; gap: 12px; flex-wrap: wrap; margin: 15px 0; }
        .prayer-item { background: #0f172a; padding: 8px 12px; border-radius: 40px; text-align: center; flex: 1; border: 1px solid #334155; }
        .answer-card { background: #0f172a; border-radius: 20px; padding: 12px; margin-bottom: 12px; transition: transform 0.2s; border: 1px solid #334155; }
        .answer-card:hover { transform: translateX(-3px); border-color: #8b5cf6; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .badge-correct { background: #10b981; padding: 2px 12px; border-radius: 30px; font-size: 11px; }
        .badge-wrong { background: #dc2626; padding: 2px 12px; border-radius: 30px; font-size: 11px; }
        .badge-pending { background: #f59e0b; padding: 2px 12px; border-radius: 30px; font-size: 11px; }
        .btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        input, textarea, select { background: #0f172a; border: 1px solid #334155; border-radius: 40px; padding: 8px 16px; color: white; width: 100%; margin: 6px 0; transition: all 0.2s; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #8b5cf6; box-shadow: 0 0 10px rgba(139,92,246,0.3); }
        .tab-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; }
        .schedule-day { background: #0f172a; border-radius: 16px; padding: 12px; margin-bottom: 12px; border: 1px solid #334155; }
        .file-item, .student-item, .leaderboard-item { background: #0f172a; border-radius: 16px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; border: 1px solid #334155; }
        .videos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .images-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .image-card { background: #0f172a; border-radius: 1rem; overflow: hidden; cursor: pointer; transition: transform 0.2s; border: 1px solid #334155; }
        .image-card:hover { transform: translateY(-4px); border-color: #8b5cf6; }
        .image-card img { width: 100%; height: 150px; object-fit: cover; }
        .video-card { background: #0f172a; border-radius: 1rem; overflow: hidden; cursor: pointer; transition: transform 0.2s; border: 1px solid #334155; }
        .video-card:hover { transform: translateY(-4px); border-color: #8b5cf6; }
        .muted-badge { background: #dc2626; padding: 2px 8px; border-radius: 1rem; font-size: 0.7rem; margin-right: 8px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 0.8rem; opacity: 0.8; font-weight: 500; }
        .progress-bar-container { background: #1e293b; border-radius: 20px; overflow: hidden; margin-top: 5px; }
        .progress-fill { width: 0%; height: 6px; background: #10b981; transition: width 0.3s; }
        .file-preview { margin-top: 8px; font-size: 0.8rem; color: #93c5fd; }
        .file-preview img { max-width: 100px; max-height: 80px; border-radius: 8px; margin-top: 5px; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: #1e293b; border-radius: 1.5rem; padding: 1.5rem; width: 90%; max-width: 900px; max-height: 90vh; overflow-y: auto; text-align: center; border: 1px solid #8b5cf6; }
        .modal-content iframe, .modal-content img { width: 100%; border-radius: 1rem; max-height: 60vh; object-fit: contain; }
        .theme-toggle { position: fixed; bottom: 20px; right: 20px; width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1000; font-size: 1.2rem; transition: 0.3s; }
        .theme-toggle:hover { transform: scale(1.1); }
        body.light-theme { background: linear-gradient(135deg, #e0e7ff, #c7d2fe); color: #1e293b; }
        body.light-theme .card, body.light-theme .header, body.light-theme .file-item, body.light-theme .answer-card { background: rgba(255,255,255,0.8); color: #1e293b; }
        @media (max-width: 800px) { .grid-2 { grid-template-columns: 1fr; } .tab-buttons .btn { font-size: 0.7rem; padding: 6px 10px; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-crown"></i> لوحة المدير - Focus Mode</h1>
        <button class="btn btn-danger" onclick="logoutNow()"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</button>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙</button>

    <div class="tab-buttons">
        <button class="btn btn-primary" onclick="showTab('answers')"><i class="fas fa-inbox"></i> الإجابات</button>
        <button class="btn btn-outline" onclick="showTab('quiz')"><i class="fas fa-question-circle"></i> الأسئلة</button>
        <button class="btn btn-outline" onclick="showTab('schedule')"><i class="fas fa-calendar-week"></i> جدول أسبوعي</button>
        <button class="btn btn-outline" onclick="showTab('students')"><i class="fas fa-users"></i> الطلاب</button>
        <button class="btn btn-outline" onclick="showTab('stats')"><i class="fas fa-chart-line"></i> إحصائيات</button>
        <button class="btn btn-outline" onclick="showTab('leaderboard')"><i class="fas fa-trophy"></i> المتصدرين</button>
        <button class="btn btn-outline" onclick="showTab('videos')"><i class="fas fa-video"></i> الفيديوهات</button>
        <button class="btn btn-outline" onclick="showTab('images')"><i class="fas fa-images"></i> الصور</button>
        <button class="btn btn-outline" onclick="showTab('studyFiles')"><i class="fas fa-file-pdf"></i> الملفات</button>
        <button class="btn btn-outline" onclick="showTab('mute')"><i class="fas fa-volume-mute"></i> كتم الطلاب</button>
    </div>

    <div id="tab-answers" class="grid-2">
        <div class="card">
            <h3><i class="fas fa-hourglass-half"></i> مؤقت الدراسة</h3>
            <div class="timer" id="timerDisplay">25:00</div>
            <div><input type="number" id="minutesInput" value="25" style="width:100px;"> دقيقة</div>
            <div><button class="btn btn-primary" id="startBtn"><i class="fas fa-play"></i> بدء</button><button class="btn btn-outline" id="pauseBtn"><i class="fas fa-pause"></i> إيقاف</button><button class="btn btn-outline" id="resetBtn"><i class="fas fa-undo"></i> إعادة</button></div>
            <hr><h3><i class="fas fa-mosque"></i> أوقات الصلاة (أبوظبي)</h3>
            <div id="prayerTimes" class="prayer-grid"></div>
            <div id="nextPrayer" class="card" style="margin-top:10px;"></div>
        </div>
        <div class="card">
            <h3><i class="fas fa-inbox"></i> إجابات الطلاب</h3>
            <input type="text" id="searchInput" placeholder="🔍 بحث"><div id="answersList"></div>
            <hr><textarea id="broadcastMsg" rows="2" placeholder="📢 رسالة جماعية"></textarea>
            <button class="btn btn-primary" onclick="sendBroadcastNow()"><i class="fas fa-bullhorn"></i> إرسال للجميع</button>
        </div>
    </div>

    <div id="tab-quiz" style="display:none;"><div class="card"><h3><i class="fas fa-plus-circle"></i> إضافة سؤال جديد</h3><input type="text" id="newQuestion" placeholder="السؤال"><input type="text" id="opt0" placeholder="الخيار 1"><input type="text" id="opt1" placeholder="الخيار 2"><input type="text" id="opt2" placeholder="الخيار 3"><input type="text" id="opt3" placeholder="الخيار 4"><input type="number" id="correctIdx" placeholder="رقم الإجابة الصحيحة (1-4)"><button class="btn btn-primary" onclick="addQuestion()"><i class="fas fa-save"></i> إضافة</button><hr><button class="btn btn-success" onclick="publishAll()"><i class="fas fa-paper-plane"></i> نشر جميع الأسئلة</button><hr><h3><i class="fas fa-list"></i> قائمة الأسئلة</h3><div id="questionsList"></div></div></div>

    <div id="tab-schedule" style="display:none;"><div class="card"><h3><i class="fas fa-plus-circle"></i> إضافة مهمة</h3><select id="weekDay"><option>الأحد</option><option>الإثنين</option><option>الثلاثاء</option><option>الأربعاء</option><option>الخميس</option><option>الجمعة</option><option>السبت</option></select><input type="text" id="taskTime" placeholder="الوقت"><input type="text" id="taskName" placeholder="المهمة"><button class="btn btn-primary" onclick="addSchedule()"><i class="fas fa-plus"></i> إضافة</button><hr><div id="scheduleList"></div></div></div>

    <div id="tab-students" style="display:none;"><div class="card"><h3><i class="fas fa-users"></i> قائمة الطلاب</h3><div id="studentsList"></div><button class="btn btn-primary" onclick="showAddStudentModal()" style="margin-top:1rem;"><i class="fas fa-user-plus"></i> إضافة طالب</button></div></div>

    <div id="tab-stats" style="display:none;"><div class="card"><h3><i class="fas fa-chart-line"></i> إحصائيات عامة</h3><div id="statsBox"></div></div></div>

    <div id="tab-leaderboard" style="display:none;"><div class="card"><h3><i class="fas fa-trophy"></i> لوحة المتصدرين</h3><div id="leaderboardBox"></div></div></div>

    <div id="tab-videos" style="display:none;"><div class="card"><h3><i class="fas fa-video"></i> مكتبة الفيديوهات</h3><div style="background:#0f172a; border-radius:1rem; padding:1rem; margin-bottom:1rem;"><h4><i class="fas fa-plus-circle"></i> إضافة فيديو</h4><div class="form-group"><label>عنوان الفيديو</label><input type="text" id="videoTitle"></div><div class="form-group"><label>رابط الفيديو (YouTube Embed)</label><input type="text" id="videoUrl"></div><div class="form-group"><label>المادة</label><select id="videoSubject"><option>الرياضيات</option><option>العلوم</option><option>اللغة العربية</option><option>اللغة الإنجليزية</option><option>البرمجة</option><option>أخرى</option></select></div><button class="btn btn-primary" onclick="addVideo()"><i class="fas fa-upload"></i> رفع الفيديو</button></div><div id="videosList" class="videos-grid"></div></div></div>

    <div id="tab-images" style="display:none;">
        <div class="card">
            <h3><i class="fas fa-images"></i> رفع صور تعليمية</h3>
            <div style="background:#0f172a; border-radius:1rem; padding:1rem; margin-bottom:1rem;">
                <div class="form-group"><label>عنوان الصورة</label><input type="text" id="imageName" placeholder="مثال: رسم بياني"></div>
                <div class="form-group"><label>المادة/التصنيف</label><select id="imageSubject"><option>الرياضيات</option><option>العلوم</option><option>اللغة العربية</option><option>اللغة الإنجليزية</option><option>البرمجة</option><option>أخرى</option></select></div>
                <div class="form-group"><label><i class="fas fa-folder-open"></i> اختر الصورة من جهازك</label><input type="file" id="realImageInput" accept="image/*"><div id="imagePreview2" class="file-preview"></div></div>
                <button class="btn btn-primary" id="uploadImageBtn"><i class="fas fa-cloud-upload-alt"></i> رفع الصورة</button>
                <div id="imageUploadStatus" style="margin-top:5px; font-size:0.7rem; color:#cbd5e1;"></div>
            </div>
            <div id="imagesList" class="images-grid"></div>
        </div>
    </div>

    <div id="tab-studyFiles" style="display:none;">
        <div class="card">
            <h3><i class="fas fa-file-pdf"></i> رفع ملفات تعليمية (PDF, DOC, PPTX)</h3>
            <div style="background:#0f172a; border-radius:1rem; padding:1rem; margin-bottom:1rem;">
                <div class="form-group"><label>عنوان الملف</label><input type="text" id="fileName" placeholder="مثال: ملخص درس الرياضيات"></div>
                <div class="form-group"><label>المادة/التصنيف</label><select id="fileSubject"><option>الرياضيات</option><option>العلوم</option><option>اللغة العربية</option><option>اللغة الإنجليزية</option><option>البرمجة</option><option>أخرى</option></select></div>
                <div class="form-group"><label><i class="fas fa-folder-open"></i> اختر الملف من جهازك</label><input type="file" id="realFileInput" accept=".pdf,.doc,.docx,.ppt,.pptx"><div id="filePreview" class="file-preview"></div></div>
                <div class="form-group"><label><i class="fas fa-chart-line"></i> حالة الرفع</label><div class="progress-bar-container"><div id="uploadProgressBar" class="progress-fill"></div></div><div id="uploadStatus" style="margin-top:5px; font-size:0.7rem; color:#cbd5e1;"></div></div>
                <button class="btn btn-primary" id="uploadRealFileBtn"><i class="fas fa-cloud-upload-alt"></i> رفع الملف الآن</button>
            </div>
            <div id="studyFilesList" class="answers-list"></div>
        </div>
    </div>

    <div id="tab-mute" style="display:none;"><div class="card"><h3><i class="fas fa-volume-mute"></i> كتم الطلاب</h3><div id="studentsMuteList" class="answers-list"></div></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCFydOV8EjlhD4AASTZFU1keYA3I6UQHyw",
        authDomain: "foucsmode-95e4f.firebaseapp.com",
        projectId: "foucsmode-95e4f",
        storageBucket: "foucsmode-95e4f.firebasestorage.app",
        messagingSenderId: "972730357334",
        appId: "1:972730357334:web:f2d3044a7c8eed588b8df7"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    let currentUser = null;
    let selectedFile = null;

    auth.onAuthStateChanged(async (user) => {
        if (!user) { window.location.href = "login.html"; return; }
        currentUser = user;
        const snap = await db.ref(`users/${user.uid}`).once("value");
        const role = snap.val()?.role;
        if (role !== "admin") { window.location.href = "login.html"; return; }
        loadAll();
    });

    function loadAll() {
        loadSubmissions(); loadPrayerTimes(); loadQuestions(); loadSchedule(); 
        loadStudents(); loadStats(); loadLeaderboard(); loadVideos(); loadMuteList(); 
        loadStudyFiles(); loadImages();
        setInterval(() => { if (document.getElementById("tab-answers").style.display !== "none") loadSubmissions(); }, 4000);
        setInterval(loadPrayerTimes, 60000);
        setInterval(() => { if (document.getElementById("tab-mute").style.display !== "none") loadMuteList(); }, 5000);
    }

    function logoutNow() { auth.signOut().then(() => window.location.href = "login.html"); }
    function toggleTheme() { document.body.classList.toggle('light-theme'); const btn = document.getElementById('themeToggle'); btn.innerHTML = document.body.classList.contains('light-theme') ? '☀️' : '🌙'; localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark'); }
    if(localStorage.getItem('theme') === 'light') toggleTheme();

    function showTab(tab) { document.querySelectorAll("[id^='tab-']").forEach(el => el.style.display = "none"); document.getElementById(`tab-${tab}`).style.display = tab==="answers" ? "grid" : "block";
        if (tab === "quiz") loadQuestions(); if (tab === "schedule") loadSchedule(); if (tab === "students") loadStudents();
        if (tab === "stats") loadStats(); if (tab === "leaderboard") loadLeaderboard(); if (tab === "videos") loadVideos();
        if (tab === "images") loadImages(); if (tab === "mute") loadMuteList(); if (tab === "studyFiles") loadStudyFiles();
    }

    // Timer
    let timeLeft = 25*60, timerInterval = null;
    const timerEl = document.getElementById("timerDisplay");
    function updateTimerDisplay() { let m = Math.floor(timeLeft/60), s = timeLeft%60; timerEl.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }
    function startTimer() { if (timerInterval) clearInterval(timerInterval); timerInterval = setInterval(() => { if (timeLeft>0) { timeLeft--; updateTimerDisplay(); } else { clearInterval(timerInterval); alert("⏰ انتهى الوقت!"); } }, 1000); }
    function pauseTimer() { if (timerInterval) clearInterval(timerInterval); timerInterval = null; }
    function resetTimer() { pauseTimer(); let mins = parseInt(document.getElementById("minutesInput").value)||25; timeLeft = mins*60; updateTimerDisplay(); }
    document.getElementById("startBtn")?.addEventListener("click", startTimer);
    document.getElementById("pauseBtn")?.addEventListener("click", pauseTimer);
    document.getElementById("resetBtn")?.addEventListener("click", resetTimer);
    resetTimer();

    // أوقات الصلاة
    async function loadPrayerTimes() {
        try {
            let d = new Date(), url = `https://api.aladhan.com/v1/timings/${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}?latitude=24.4539&longitude=54.3773&method=8&timezonestring=Asia/Dubai`;
            let res = await fetch(url), data = await res.json();
            if (data.code === 200) {
                let timings = data.data.timings, prayers = ["Fajr","Dhuhr","Asr","Maghrib","Isha"], names = ["الفجر","الظهر","العصر","المغرب","العشاء"];
                let html = ""; for (let i=0;i<prayers.length;i++) html += `<div class="prayer-item"><div>${names[i]}</div><div>${timings[prayers[i]]}</div></div>`;
                document.getElementById("prayerTimes").innerHTML = html;
                let now = new Date(), nowMin = now.getHours()*60+now.getMinutes(), nextTime = null, minDiff = Infinity;
                for (let i=0;i<prayers.length;i++) { let [h,m] = timings[prayers[i]].split(":"); let pm = parseInt(h)*60+parseInt(m); let diff = pm - nowMin; if (diff > 0 && diff < minDiff) { minDiff = diff; nextTime = names[i]; } }
                if (!nextTime) { let [h,m] = timings["Fajr"].split(":"); minDiff = (24*60-nowMin)+(parseInt(h)*60+parseInt(m)); nextTime = "الفجر"; }
                document.getElementById("nextPrayer").innerHTML = `🕋 القادمة: ${nextTime} بعد ${Math.floor(minDiff/60)} س و ${minDiff%60} د`;
            }
        } catch(e) { console.warn(e); }
    }

    // الإجابات
    let allSubmissions = [];
    async function loadSubmissions() { let snap = await db.ref("submissions").once("value"); let data = snap.val()||{}; allSubmissions = Object.entries(data).map(([id,val])=>({id,...val})).reverse(); renderAnswers(); }
    function renderAnswers() { let search = document.getElementById("searchInput")?.value.toLowerCase()||""; let filtered = allSubmissions.filter(s=>s.studentName?.toLowerCase().includes(search)||s.text?.toLowerCase().includes(search)); let container = document.getElementById("answersList"); if (!filtered.length) { container.innerHTML = "<div class='card'>✨ لا إجابات حالياً</div>"; return; } let html = ""; filtered.forEach(sub => { let badge = sub.grade==="correct"?"<span class='badge-correct'>✓ صحيح +5</span>":(sub.grade==="wrong"?"<span class='badge-wrong'>✗ خطأ</span>":"<span class='badge-pending'>⏳ قيد</span>"); html += `<div class="answer-card"><div class="flex-between"><div><i class="fas fa-user-circle"></i> <strong>${escapeHtml(sub.studentName)}</strong> <small>${new Date(sub.timestamp).toLocaleString()}</small></div>${badge}</div><div>${sub.text?`📝 ${escapeHtml(sub.text)}`:""} ${sub.imageUrl?`<a href="${sub.imageUrl}" target="_blank">🖼️ صورة</a>`:""}</div><div>${sub.feedback?`📩 ${escapeHtml(sub.feedback)}`:""}</div><div class="btns"><button class="btn btn-success" onclick="gradeSub('${sub.id}','correct')">✔️ صحيح</button><button class="btn btn-danger" onclick="gradeSub('${sub.id}','wrong')">❌ خطأ</button><button class="btn" onclick="sendMsgToStudent('${sub.id}')">💬 رسالة</button><button class="btn btn-danger" onclick="deleteSub('${sub.id}')">🗑️ حذف</button></div></div>`; }); container.innerHTML = html; }
    window.gradeSub = async (id, grade) => { let subRef = db.ref(`submissions/${id}`); let sub = (await subRef.once("value")).val(); if (!sub) return; let msg = grade==="correct"?"✅ أحسنت! +5 نقاط":"❌ حاول مرة أخرى"; await subRef.update({ grade, feedback: msg }); if (grade==="correct") { let pointsRef = db.ref(`users/${sub.studentId}/points`); let cur = (await pointsRef.once("value")).val()||0; await pointsRef.set(cur+5); } loadSubmissions(); };
    window.sendMsgToStudent = async (id) => { let msg = prompt("📝 أكتب رسالتك للطالب:"); if (msg) await db.ref(`submissions/${id}`).update({ feedback: msg }); loadSubmissions(); };
    window.deleteSub = async (id) => { if (confirm("حذف الإجابة؟")) { await db.ref(`submissions/${id}`).remove(); loadSubmissions(); } };
    window.sendBroadcastNow = async () => { let msg = document.getElementById("broadcastMsg").value.trim(); if (!msg) return alert("اكتب رسالة"); await db.ref("broadcast").push({ message: msg, time: Date.now() }); alert("✅ أرسلت للجميع"); document.getElementById("broadcastMsg").value = ""; };
    function escapeHtml(str) { if (!str) return ""; return str.replace(/[&<>]/g, m => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" })[m]); }

    // الأسئلة
    let questions = [];
    async function loadQuestions() { let snap = await db.ref("quiz").once("value"); questions = Object.entries(snap.val()||{}).map(([id,q])=>({id,...q})); let cont = document.getElementById("questionsList"); if (!questions.length) { cont.innerHTML = "<div class='card'>📭 لا توجد أسئلة</div>"; return; } let html = ""; questions.forEach((q,i) => { html += `<div class="answer-card"><div><strong>سؤال ${i+1}:</strong> ${escapeHtml(q.question)}</div><div>${(q.options||[]).map((opt,idx)=>`${idx+1}- ${opt} ${idx===q.correct?"✅":""}`).join(" | ")}</div><div>⏱️ ${q.time||30} ث | ⭐ ${q.points||5}</div><div class="btns"><button class="btn btn-primary" onclick="editQuestionPrompt('${q.id}')">✏️ تعديل</button><button class="btn btn-danger" onclick="deleteQuestion('${q.id}')">🗑️ حذف</button></div></div>`; }); cont.innerHTML = html; }
    window.addQuestion = () => { let q = document.getElementById("newQuestion").value.trim(); let opts = [document.getElementById("opt0").value.trim(), document.getElementById("opt1").value.trim(), document.getElementById("opt2").value.trim(), document.getElementById("opt3").value.trim()].filter(o=>o); let correct = parseInt(document.getElementById("correctIdx").value)-1; if (!q || opts.length<2 || isNaN(correct)) { alert("املأ البيانات"); return; } db.ref("quiz").push({ question: q, options: opts, correct, published: false, time: 30, points: 5 }); alert("✅ تمت الإضافة"); document.getElementById("newQuestion").value = ""; ["opt0","opt1","opt2","opt3","correctIdx"].forEach(id=>document.getElementById(id).value=""); loadQuestions(); };
    window.publishAll = async () => { if (!questions.length) return alert("لا توجد أسئلة"); for (let q of questions) await db.ref(`quiz/${q.id}`).update({ published: true }); alert("✅ تم نشر جميع الأسئلة"); loadQuestions(); };
    window.deleteQuestion = async (id) => { if (confirm("حذف السؤال؟")) { await db.ref(`quiz/${id}`).remove(); loadQuestions(); } };
    window.editQuestionPrompt = async (id) => { let q = questions.find(qq=>qq.id===id); if (!q) return; let newQ = prompt("السؤال الجديد:", q.question); if (!newQ) return; let newOpts = prompt("الخيارات:", q.options.join(",")); if (!newOpts) return; let newCorrect = prompt("رقم الإجابة الصحيحة:", (q.correct+1)); await db.ref(`quiz/${id}`).update({ question: newQ, options: newOpts.split(","), correct: parseInt(newCorrect)-1 }); loadQuestions(); };

    // الجدول
    async function loadSchedule() { let snap = await db.ref("weekly_schedule").once("value"); let data = snap.val()||{}, days = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"]; let html = ""; for (let day of days) { if (data[day] && data[day].length) { html += `<div class="schedule-day"><div><strong>📅 ${day}</strong></div>`; data[day].forEach((t,idx)=> { html += `<div class="flex-between"><span>⏰ ${escapeHtml(t.time)} - ${escapeHtml(t.task)}</span><button class="btn btn-danger btn-sm" onclick="deleteTask('${day}',${idx})">🗑️</button></div>`; }); html += `</div>`; } } if (!html) html = "<div class='card'>📭 لا مهام</div>"; document.getElementById("scheduleList").innerHTML = html; }
    window.addSchedule = async () => { let day = document.getElementById("weekDay").value, time = document.getElementById("taskTime").value.trim(), task = document.getElementById("taskName").value.trim(); if (!time || !task) { alert("أدخل الوقت والمهمة"); return; } let ref = db.ref(`weekly_schedule/${day}`); let arr = (await ref.once("value")).val()||[]; arr.push({ time, task }); await ref.set(arr); loadSchedule(); };
    window.deleteTask = async (day, idx) => { let ref = db.ref(`weekly_schedule/${day}`); let arr = (await ref.once("value")).val()||[]; arr.splice(idx,1); await ref.set(arr); loadSchedule(); };

    // الطلاب
    async function loadStudents() { let snap = await db.ref("users").once("value"); let users = snap.val()||{}, students = Object.entries(users).filter(([_,u])=>u.role==="student").map(([id,u])=>({id,...u})); let html = ""; for (let s of students) html += `<div class="student-item"><div><i class="fas fa-user-graduate"></i> <strong>${escapeHtml(s.displayName)}</strong><br><small>${s.email}</small><br>⭐ ${s.points||0}</div><button class="btn btn-danger" onclick="deleteStudent('${s.id}')"><i class="fas fa-trash"></i> حذف</button></div>`; if (!html) html = "<div class='card'>👥 لا طلاب</div>"; document.getElementById("studentsList").innerHTML = html; }
    window.deleteStudent = async (uid) => { if (confirm("حذف الطالب؟")) { await db.ref(`users/${uid}`).remove(); loadStudents(); } };
    function showAddStudentModal() { const email = prompt("📧 البريد الإلكتروني:"); if (!email) return; const pwd = prompt("🔒 كلمة المرور:"); if (!pwd) return; const name = prompt("👤 الاسم:"); if (!name) return; auth.createUserWithEmailAndPassword(email, pwd).then(async uc => { await db.ref(`users/${uc.user.uid}`).set({ email, role: 'student', displayName: name, points: 0, badges: [], createdAt: new Date().toISOString() }); alert("✅ تمت الإضافة"); loadStudents(); }).catch(e => alert(e.message)); }

    // إحصائيات
    async function loadStats() { let subs = await db.ref("submissions").once("value"); let submissions = Object.values(subs.val()||{}); let correct = submissions.filter(s=>s.grade==="correct").length, total = submissions.length, rate = total?Math.round((correct/total)*100):0; let usersSnap = await db.ref("users").once("value"); let students = Object.values(usersSnap.val()||{}).filter(u=>u.role==="student"); let totalPoints = students.reduce((sum,s)=>sum+(s.points||0),0); document.getElementById("statsBox").innerHTML = `<div class="card"><i class="fas fa-users"></i> الطلاب: ${students.length}</div><div class="card"><i class="fas fa-inbox"></i> الإجابات: ${total}</div><div class="card"><i class="fas fa-check-circle"></i> نسبة الصحيح: ${rate}%</div><div class="card"><i class="fas fa-star"></i> مجموع النقاط: ${totalPoints}</div>`; }

    // لوحة المتصدرين
    async function loadLeaderboard() { let usersSnap = await db.ref("users").once("value"); let students = Object.values(usersSnap.val()||{}).filter(u=>u.role==="student"); students.sort((a,b)=>(b.points||0)-(a.points||0)); let html = ""; students.forEach((s,i)=> { html += `<div class="leaderboard-item"><div><strong class="rank-${i+1}">#${i+1}</strong> ${escapeHtml(s.displayName)}</div><div><i class="fas fa-star" style="color:#facc15;"></i> ${s.points||0}</div></div>`; }); if (!html) html = "<div class='card'>🏆 لا نقاط</div>"; document.getElementById("leaderboardBox").innerHTML = html; }

    // الفيديوهات
    async function loadVideos() { const snap = await db.ref('videos').once('value'); const videos = snap.val() || {}; const cont = document.getElementById('videosList'); if (!cont) return; if (Object.keys(videos).length === 0) { cont.innerHTML = '<div class="card">🎬 لا فيديوهات</div>'; return; } let html = ''; for (let id in videos) { const v = videos[id]; html += `<div class="video-card" onclick="playVideo('${v.url}')"><div style="background:linear-gradient(135deg,#3b82f6,#8b5cf6); height:150px; display:flex; align-items:center; justify-content:center; font-size:3rem;"><i class="fas fa-play-circle"></i></div><div style="padding:0.8rem;"><div style="font-weight:bold;">${escapeHtml(v.title)}</div><div style="font-size:0.7rem; background:#3b82f6; display:inline-block; padding:0.2rem 0.5rem; border-radius:1rem;">📚 ${escapeHtml(v.subject)}</div><div><button class="btn-danger btn-sm" onclick="event.stopPropagation(); deleteVideo('${id}')"><i class="fas fa-trash"></i> حذف</button></div></div></div>`; } cont.innerHTML = html; }
    window.addVideo = async () => { const title = document.getElementById('videoTitle')?.value.trim(), url = document.getElementById('videoUrl')?.value.trim(), subject = document.getElementById('videoSubject')?.value; if (!title || !url) { alert('أدخل عنوان ورابط الفيديو'); return; } await db.ref('videos').push({ title, url, subject, uploadedBy: currentUser.uid, uploadedAt: Date.now() }); alert('✅ تمت الإضافة'); document.getElementById('videoTitle').value = ''; document.getElementById('videoUrl').value = ''; loadVideos(); };
    window.deleteVideo = async (id) => { if (confirm('حذف الفيديو؟')) { await db.ref(`videos/${id}`).remove(); loadVideos(); } };
    window.playVideo = (url) => { const modal = document.createElement('div'); modal.className = 'modal-overlay'; modal.innerHTML = `<div class="modal-content"><iframe src="${url}" frameborder="0" allowfullscreen style="width:100%; height:400px; border-radius:1rem;"></iframe><button class="btn btn-primary" style="margin-top:1rem;" onclick="this.closest('.modal-overlay').remove()"><i class="fas fa-times"></i> إغلاق</button></div>`; document.body.appendChild(modal); modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); }); };

    // كتم الطلاب
    async function loadMuteList() { const usersSnap = await db.ref('users').once('value'); const users = usersSnap.val() || {}; const students = []; for (let uid in users) if (users[uid].role === 'student') students.push({ uid, ...users[uid] }); const mutedSnap = await db.ref('mutedStudents').once('value'); const muted = mutedSnap.val() || {}; const now = Date.now(); const cont = document.getElementById('studentsMuteList'); if (!cont) return; if (students.length === 0) { cont.innerHTML = '<div class="card">👥 لا طلاب</div>'; return; } let html = ''; for (let s of students) { const isMuted = muted[s.uid] && muted[s.uid].mutedUntil > now; const timeLeft = isMuted ? Math.ceil((muted[s.uid].mutedUntil - now) / 1000 / 60) : 0; html += `<div class="answer-card"><div class="flex-between"><div><i class="fas fa-user-circle"></i> <strong>${escapeHtml(s.displayName)}</strong>${isMuted ? `<span class="muted-badge"><i class="fas fa-microphone-slash"></i> مكتوم (${timeLeft} د)</span>` : ''}</div><div>${!isMuted ? `<button class="btn" style="background:#f59e0b;" onclick="muteStudent('${s.uid}', '${escapeHtml(s.displayName)}')"><i class="fas fa-microphone-slash"></i> كتم</button>` : `<button class="btn btn-success" onclick="unmuteStudent('${s.uid}')"><i class="fas fa-microphone"></i> إلغاء</button>`}</div></div></div>`; } cont.innerHTML = html; }
    window.muteStudent = async (uid, name) => { const minutes = parseInt(prompt(`كم دقيقة تريد كتم "${name}"؟`, 5)); if (isNaN(minutes) || minutes < 1) return; await db.ref(`mutedStudents/${uid}`).set({ mutedUntil: Date.now() + (minutes * 60 * 1000), mutedBy: currentUser.uid, mutedAt: Date.now() }); alert(`✅ تم كتم ${name} لمدة ${minutes} دقائق`); loadMuteList(); };
    window.unmuteStudent = async (uid) => { if (confirm('إلغاء الكتم؟')) { await db.ref(`mutedStudents/${uid}`).remove(); alert('✅ تم إلغاء الكتم'); loadMuteList(); } };

    // ========== رفع الصور ==========
    document.getElementById('realImageInput')?.addEventListener('change', (event) => {
        const file = event.target.files[0];
        const previewDiv = document.getElementById('imagePreview2');
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => { previewDiv.innerHTML = `<img src="${e.target.result}" style="max-width:100px; border-radius:8px; margin-top:5px;">`; };
            reader.readAsDataURL(file);
        } else { previewDiv.innerHTML = ''; }
    });

    window.uploadImageFile = async () => {
        const name = document.getElementById('imageName').value.trim();
        const subject = document.getElementById('imageSubject').value;
        const file = document.getElementById('realImageInput').files[0];
        if (!name) { alert("أدخل عنوان الصورة"); return; }
        if (!file) { alert("اختر صورة أولاً"); return; }
        
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', 'focus_unsigned');
        formData.append('cloud_name', 'dt1lrpvhq');
        formData.append('resource_type', 'image');
        
        const statusDiv = document.getElementById('imageUploadStatus');
        statusDiv.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الرفع...';
        
        try {
            const response = await fetch('https://api.cloudinary.com/v1_1/dt1lrpvhq/image/upload', { method: 'POST', body: formData });
            if (!response.ok) throw new Error('فشل الرفع');
            const data = await response.json();
            await db.ref('images').push({ name, url: data.secure_url, subject, type: file.type, size: file.size, uploadedBy: currentUser.uid, uploadedAt: Date.now() });
            statusDiv.innerHTML = '<i class="fas fa-check-circle"></i> ✅ تم رفع الصورة بنجاح!';
            document.getElementById('imageName').value = ''; document.getElementById('realImageInput').value = ''; document.getElementById('imagePreview2').innerHTML = '';
            loadImages();
            setTimeout(() => statusDiv.innerHTML = '', 3000);
        } catch (error) { statusDiv.innerHTML = '❌ فشل الرفع: ' + error.message; }
    };
    document.getElementById('uploadImageBtn')?.addEventListener('click', () => window.uploadImageFile());

    async function loadImages() {
        const snapshot = await db.ref('images').once('value');
        const images = snapshot.val() || {};
        const container = document.getElementById('imagesList');
        if (!container) return;
        if (Object.keys(images).length === 0) { container.innerHTML = '<div class="card">🖼️ لا توجد صور</div>'; return; }
        let html = '';
        for (let id in images) {
            const img = images[id];
            html += `<div class="image-card" onclick="window.open('${img.url}', '_blank')">
                <img src="${img.url}" alt="${escapeHtml(img.name)}">
                <div style="padding:0.8rem;"><div style="font-weight:bold;">${escapeHtml(img.name)}</div><div style="font-size:0.7rem; background:#3b82f6; display:inline-block; padding:0.2rem 0.5rem; border-radius:1rem;">📚 ${escapeHtml(img.subject)}</div><div><button class="btn-danger btn-sm" onclick="event.stopPropagation(); deleteImage('${id}')"><i class="fas fa-trash"></i> حذف</button></div></div>
            </div>`;
        }
        container.innerHTML = html;
    }
    window.deleteImage = async (id) => { if (confirm('حذف الصورة؟')) { await db.ref(`images/${id}`).remove(); loadImages(); } };

    // ========== رفع الملفات ==========
    document.getElementById('realFileInput')?.addEventListener('change', (event) => {
        selectedFile = event.target.files[0];
        const previewDiv = document.getElementById('filePreview');
        if (selectedFile) {
            let fileInfo = `<i class="fas fa-file"></i> ${selectedFile.name} (${(selectedFile.size / 1024).toFixed(2)} KB)`;
            if (selectedFile.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => { previewDiv.innerHTML = `${fileInfo}<br><img src="${e.target.result}" style="max-width:100px; border-radius:8px; margin-top:5px;">`; };
                reader.readAsDataURL(selectedFile);
            } else { previewDiv.innerHTML = fileInfo; }
        } else { previewDiv.innerHTML = ''; }
    });

    window.uploadRealFile = async () => {
        const name = document.getElementById('fileName').value.trim();
        const subject = document.getElementById('fileSubject').value;
        if (!name) { alert("أدخل عنوان الملف"); return; }
        if (!selectedFile) { alert("اختر ملفاً أولاً"); return; }
        
        const formData = new FormData();
        formData.append('file', selectedFile);
        formData.append('upload_preset', 'focus_unsigned');
        formData.append('cloud_name', 'dt1lrpvhq');
        
        // ✅ الحل النهائي: PDF يرفع كـ raw، الباقي auto
        if (selectedFile.type === 'application/pdf') {
            formData.append('resource_type', 'raw');
        } else {
            formData.append('resource_type', 'auto');
        }
        
        const progressBar = document.getElementById('uploadProgressBar');
        const statusDiv = document.getElementById('uploadStatus');
        statusDiv.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الرفع...';
        progressBar.style.width = '30%';
        
        try {
            const response = await fetch('https://api.cloudinary.com/v1_1/dt1lrpvhq/upload', { method: 'POST', body: formData });
            if (!response.ok) { const errorData = await response.json(); throw new Error(errorData.error?.message || 'فشل الرفع'); }
            
            const data = await response.json();
            progressBar.style.width = '70%';
            let finalUrl = data.secure_url;
            
            // التأكد من أن رابط PDF صحيح
            if (selectedFile.type === 'application/pdf' && finalUrl.includes('/image/upload/')) {
                finalUrl = finalUrl.replace('/image/upload/', '/raw/upload/');
            }
            
            progressBar.style.width = '90%';
            statusDiv.innerHTML = '<i class="fas fa-save"></i> جاري الحفظ...';
            
            await db.ref('study_files').push({ name, url: finalUrl, subject, type: selectedFile.type, size: selectedFile.size, uploadedBy: currentUser.uid, uploadedAt: Date.now() });
            
            progressBar.style.width = '100%';
            statusDiv.innerHTML = '<i class="fas fa-check-circle"></i> ✅ تم الرفع بنجاح!';
            
            document.getElementById('fileName').value = ''; document.getElementById('realFileInput').value = ''; document.getElementById('filePreview').innerHTML = '';
            selectedFile = null;
            loadStudyFiles();
            setTimeout(() => { progressBar.style.width = '0%'; statusDiv.innerHTML = ''; }, 3000);
        } catch (error) { 
            statusDiv.innerHTML = '❌ فشل الرفع: ' + error.message; 
            progressBar.style.width = '0%'; 
        }
    };
    document.getElementById('uploadRealFileBtn')?.addEventListener('click', () => window.uploadRealFile());

    async function loadStudyFiles() {
        const snapshot = await db.ref('study_files').once('value');
        const files = snapshot.val() || {};
        const container = document.getElementById('studyFilesList');
        if (!container) return;
        if (Object.keys(files).length === 0) { container.innerHTML = '<div class="card">📄 لا توجد ملفات</div>'; return; }
        let html = '';
        for (let id in files) {
            const f = files[id];
            const icon = f.type?.startsWith('image/') ? '<i class="fas fa-image"></i>' : (f.type?.includes('pdf') ? '<i class="fas fa-file-pdf"></i>' : '<i class="fas fa-file"></i>');
            html += `<div class="file-item">
                <div>${icon} <strong>${escapeHtml(f.name)}</strong><br><span style="font-size:0.7rem;"><i class="fas fa-book"></i> ${escapeHtml(f.subject)} | <i class="fas fa-database"></i> ${(f.size/1024).toFixed(1)} KB</span></div>
                <div style="display: flex; gap: 5px;">
                    <button class="btn btn-sm" style="background:#3b82f6;" onclick="openFilePreview('${f.url}', '${escapeHtml(f.name)}', '${f.type}')"><i class="fas fa-eye"></i> فتح</button>
                    <a href="${f.url}" download="${escapeHtml(f.name)}" target="_blank" class="btn btn-sm" style="background:#10b981; text-decoration:none;"><i class="fas fa-download"></i> تحميل</a>
                    <button class="btn btn-danger btn-sm" onclick="deleteStudyFile('${id}')"><i class="fas fa-trash"></i> حذف</button>
                </div>
            </div>`;
        }
        container.innerHTML = html;
    }

    window.openFilePreview = (url, fileName, fileType) => {
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        const downloadLink = `<a href="${url}" download="${fileName}" target="_blank" class="btn btn-success" style="margin-right:10px;"><i class="fas fa-download"></i> تحميل</a>`;
        if (fileType?.startsWith('image/')) {
            modal.innerHTML = `<div class="modal-content"><img src="${url}" style="max-width:100%; max-height:60vh;"><div style="margin-top:1rem;">${downloadLink}<button class="btn btn-primary" onclick="this.closest('.modal-overlay').remove()"><i class="fas fa-times"></i> إغلاق</button></div></div>`;
        } else if (fileType?.includes('pdf')) {
            let pdfUrl = url;
            if (pdfUrl.includes('/image/upload/')) { pdfUrl = pdfUrl.replace('/image/upload/', '/raw/upload/'); }
            modal.innerHTML = `<div class="modal-content"><iframe src="${pdfUrl}" style="width:100%; height:70vh;"></iframe><div style="margin-top:1rem;">${downloadLink}<button class="btn btn-primary" onclick="this.closest('.modal-overlay').remove()"><i class="fas fa-times"></i> إغلاق</button></div></div>`;
        } else {
            modal.innerHTML = `<div class="modal-content"><div style="font-size:3rem;"><i class="fas fa-file"></i></div><div style="font-weight:bold;">${fileName}</div><div style="margin:1rem;">لا يمكن معاينة هذا الملف مباشرة</div><div>${downloadLink}<button class="btn btn-primary" onclick="this.closest('.modal-overlay').remove()"><i class="fas fa-times"></i> إغلاق</button></div></div>`;
        }
        document.body.appendChild(modal);
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
    };
    window.deleteStudyFile = async (id) => { if (confirm('حذف هذا الملف؟')) { await db.ref(`study_files/${id}`).remove(); loadStudyFiles(); } };
</script>
</body>
