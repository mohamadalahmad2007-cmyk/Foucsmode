<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Mode - دخول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 2.5rem;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            width: 90%;
            max-width: 450px;
        }
        h1 {
            color: white;
            margin-bottom: 2rem;
            font-size: 2rem;
        }
        .btn-role {
            display: block;
            width: 100%;
            padding: 1rem;
            margin: 1rem 0;
            border: none;
            border-radius: 3rem;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-teacher {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
        }
        .btn-student {
            background: linear-gradient(135deg, #10b981, #06b6d4);
            color: white;
        }
        .btn-role:hover {
            transform: translateY(-3px);
            filter: brightness(1.05);
        }
        .features {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(0,0,0,0.3);
            border-radius: 1rem;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        footer {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🧘 Focus Mode <span style="font-size:0.8rem;">v2.0</span></h1>
        <button class="btn-role btn-teacher" onclick="window.location.href='teacher.html'">
            👨‍🏫 دخول كـ <strong>أستاذ / مشرف</strong>
        </button>
        <button class="btn-role btn-student" onclick="window.location.href='student.html'">
            🧑‍🎓 دخول كـ <strong>طالب</strong>
        </button>
        <div class="features">
            ✨ الميزات الجديدة:<br>
            📊 إحصائيات ورسم بياني | ⏰ جدول يومي | 🎮 نقاط ومكافآت | 📎 مشاركة ملفات
        </div>
        <footer>🕌 أوقات الصلاة - أبوظبي | 🧘 Focus Mode للمذاكرة الجماعية</footer>
    </div>
</body>
</html>
