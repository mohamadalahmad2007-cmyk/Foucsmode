<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Mode - تسجيل الدخول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #0f172a);
            background-size: 200% 200%;
            animation: gradientShift 12s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .login-container {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 2.5rem;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%;
            max-width: 450px;
            animation: fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-animation {
            font-size: 4rem;
            animation: bounce 2s infinite;
            display: inline-block;
        }
        @keyframes bounce {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        h1 {
            color: white;
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 0.85rem;
        }
        .tab-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }
        .tab-btn {
            flex: 1;
            padding: 0.8rem;
            background: rgba(255,255,255,0.05);
            border: none;
            border-radius: 2rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        }
        .form-group {
            margin-bottom: 1.2rem;
            text-align: right;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1rem;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59,130,246,0.3);
        }
        .btn-login {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            border-radius: 2rem;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #1e40af;
            transform: translateY(-2px);
        }
        .btn-login:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1e40af;
        }
        .btn-logout {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(135deg, #dc2626, #ef4444);
            border: none;
            border-radius: 2rem;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #991b1b;
            transform: translateY(-2px);
            margin-top: 1rem;
        }
        .btn-logout:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #991b1b;
        }
        .error-msg {
            color: #ef4444;
            margin-top: 1rem;
            font-size: 0.85rem;
        }
        .success-msg {
            color: #10b981;
            margin-top: 1rem;
            font-size: 0.85rem;
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-left: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        footer {
            margin-top: 1.5rem;
            font-size: 0.7rem;
            color: #64748b;
        }
        .current-user-info {
            background: rgba(255,255,255,0.05);
            border-radius: 1rem;
            padding: 0.8rem;
            margin-bottom: 1rem;
            font-size: 0.8rem;
        }
        .clear-data-btn {
            background: none;
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 0.3rem 0.8rem;
            border-radius: 1rem;
            cursor: pointer;
            font-size: 0.7rem;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-animation">🧘</div>
        <h1>Focus Mode</h1>
        <div class="subtitle">نظام إدارة المجموعات الدراسية</div>
        
        <!-- معلومات المستخدم الحالي (إذا كان مسجل) -->
        <div id="currentUserInfo" class="current-user-info" style="display: none;">
            <i class="fas fa-user-circle"></i> <span id="currentUserEmail"></span>
            <button class="clear-data-btn" onclick="forceLogout()">تسجيل خروج</button>
        </div>
        
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="showTab('login')">تسجيل الدخول</button>
            <button class="tab-btn" onclick="showTab('register')">إنشاء حساب جديد</button>
        </div>
        
        <!-- تسجيل الدخول -->
        <div id="loginPanel">
            <div class="form-group">
                <label>📧 البريد الإلكتروني</label>
                <input type="email" id="loginEmail" placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label>🔒 كلمة المرور</label>
                <input type="password" id="loginPassword" placeholder="********">
            </div>
            <button class="btn-login" onclick="doLogin()">دخول</button>
            <div id="loginError" class="error-msg"></div>
        </div>
        
        <!-- إنشاء حساب -->
        <div id="registerPanel" style="display: none;">
            <div class="form-group">
                <label>👤 الاسم الكامل</label>
                <input type="text" id="regName" placeholder="أحمد محمد">
            </div>
            <div class="form-group">
                <label>📧 البريد الإلكتروني</label>
                <input type="email" id="regEmail" placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label>🔒 كلمة المرور</label>
                <input type="password" id="regPassword" placeholder="كلمة مرور قوية">
            </div>
            <div class="form-group">
                <label>🔄 تأكيد كلمة المرور</label>
                <input type="password" id="regConfirmPassword" placeholder="أعد كتابة كلمة المرور">
            </div>
            <button class="btn-login" onclick="doRegister()">إنشاء حساب</button>
            <div id="registerError" class="error-msg"></div>
            <div id="registerSuccess" class="success-msg"></div>
        </div>
        
        <button class="btn-logout" onclick="forceLogoutAndClear()">🚪 تسجيل خروج ومسح البيانات</button>
        
        <footer>
            🕌 أوقات الصلاة - أبوظبي | نظام متكامل للمجموعات الدراسية
        </footer>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <script>
        // 🔥 إعدادات Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCFydOV8EjlhD4AASTZFU1keYA3I6UQHyw",
            authDomain: "foucsmode-95e4f.firebaseapp.com",
            projectId: "foucsmode-95e4f",
            storageBucket: "foucsmode-95e4f.firebasestorage.app",
            messagingSenderId: "972730357334",
            appId: "1:972730357334:web:f2d3044a7c8eed588b8df7",
            measurementId: "G-519W7HSYD7"
        };
        
        // تهيئة Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();
        
        function showTab(tab) {
            document.getElementById('loginPanel').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('registerPanel').style.display = tab === 'register' ? 'block' : 'none';
            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                if ((tab === 'login' && idx === 0) || (tab === 'register' && idx === 1)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        
        // دالة لإصلاح دور المستخدم تلقائياً
        async function fixUserRole(user, email) {
            const userRef = database.ref(`users/${user.uid}`);
            const snapshot = await userRef.once('value');
            let userData = snapshot.val();
            
            let correctRole = 'student';
            let correctName = email.split('@')[0];
            
            if (email === 'admin@focus.com') {
                correctRole = 'admin';
                correctName = 'مدير النظام';
            } else if (email === 'teacher@focus.com') {
                correctRole = 'teacher';
                correctName = 'أستاذ';
            }
            
            if (!userData || userData.role !== correctRole) {
                console.log(`🔧 إصلاح دور المستخدم: ${correctRole}`);
                userData = {
                    email: user.email,
                    role: correctRole,
                    displayName: correctName,
                    points: userData?.points || 0,
                    badges: userData?.badges || [],
                    createdAt: userData?.createdAt || new Date().toISOString()
                };
                await userRef.set(userData);
            }
            
            return userData;
        }
        
        // دالة تسجيل خروج قوية
        async function forceLogout() {
            try {
                await auth.signOut();
                localStorage.removeItem('focusMode_currentUser');
                sessionStorage.clear();
                document.getElementById('currentUserInfo').style.display = 'none';
                document.getElementById('loginEmail').value = '';
                document.getElementById('loginPassword').value = '';
                console.log("✅ تم تسجيل الخروج بنجاح");
            } catch (error) {
                console.error("❌ خطأ في تسجيل الخروج:", error);
            }
        }
        
        // دالة تسجيل خروج ومسح كل البيانات
        async function forceLogoutAndClear() {
            try {
                await auth.signOut();
                localStorage.clear();
                sessionStorage.clear();
                document.getElementById('currentUserInfo').style.display = 'none';
                document.getElementById('loginEmail').value = '';
                document.getElementById('loginPassword').value = '';
                console.log("✅ تم تسجيل الخروج ومسح كل البيانات");
                location.reload();
            } catch (error) {
                console.error("❌ خطأ:", error);
                location.reload();
            }
        }
        
        // دالة تسجيل الدخول
        async function doLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            
            if (!email || !password) {
                errorDiv.innerHTML = '⚠️ الرجاء إدخال البريد الإلكتروني وكلمة المرور';
                return;
            }
            
            errorDiv.innerHTML = '<span class="loading"></span> جاري تسجيل الدخول...';
            
            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                const userData = await fixUserRole(user, email);
                
                localStorage.setItem('focusMode_currentUser', JSON.stringify({
                    uid: user.uid,
                    email: user.email,
                    role: userData.role,
                    displayName: userData.displayName
                }));
                
                if (userData.role === 'admin') {
                    window.location.href = 'admin.html';
                } else if (userData.role === 'teacher') {
                    window.location.href = 'teacher.html';
                } else {
                    window.location.href = 'student.html';
                }
                
            } catch (error) {
                console.error(error);
                if (error.code === 'auth/invalid-login-credentials') {
                    errorDiv.innerHTML = '❌ البريد الإلكتروني أو كلمة المرور غير صحيحة';
                } else {
                    errorDiv.innerHTML = '❌ خطأ: ' + error.message;
                }
            }
        }
        
        // دالة إنشاء حساب
        async function doRegister() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const errorDiv = document.getElementById('registerError');
            const successDiv = document.getElementById('registerSuccess');
            
            errorDiv.innerHTML = '';
            successDiv.innerHTML = '';
            
            if (!name || !email || !password) {
                errorDiv.innerHTML = '⚠️ الرجاء ملء جميع الحقول';
                return;
            }
            
            if (password !== confirmPassword) {
                errorDiv.innerHTML = '⚠️ كلمة المرور وتأكيدها غير متطابقين';
                return;
            }
            
            if (password.length < 6) {
                errorDiv.innerHTML = '⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل';
                return;
            }
            
            errorDiv.innerHTML = '<span class="loading"></span> جاري إنشاء الحساب...';
            
            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                await database.ref(`users/${user.uid}`).set({
                    email: email,
                    role: 'student',
                    displayName: name,
                    points: 0,
                    badges: [],
                    createdAt: new Date().toISOString()
                });
                
                successDiv.innerHTML = '✅ تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول';
                
                document.getElementById('regName').value = '';
                document.getElementById('regEmail').value = '';
                document.getElementById('regPassword').value = '';
                document.getElementById('regConfirmPassword').value = '';
                
                setTimeout(() => {
                    showTab('login');
                    document.getElementById('loginEmail').value = email;
                    successDiv.innerHTML = '';
                }, 2000);
                
            } catch (error) {
                console.error(error);
                if (error.code === 'auth/email-already-in-use') {
                    errorDiv.innerHTML = '❌ هذا البريد مسجل مسبقاً';
                } else {
                    errorDiv.innerHTML = '❌ خطأ: ' + error.message;
                }
            }
        }
        
        // التحقق من جلسة سابقة وعرض معلومات المستخدم
        auth.onAuthStateChanged(async (user) => {
            const infoDiv = document.getElementById('currentUserInfo');
            const emailSpan = document.getElementById('currentUserEmail');
            
            if (user) {
                // عرض معلومات المستخدم الحالي
                emailSpan.innerText = user.email;
                infoDiv.style.display = 'block';
                
                // إذا كنا في صفحة login ولدينا مستخدم، نعرض رسالة
                console.log("👤 مستخدم مسجل دخول حالياً:", user.email);
            } else {
                infoDiv.style.display = 'none';
            }
        });
    </script>
</body>
</html>
