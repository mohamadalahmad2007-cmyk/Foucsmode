<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Mode - دخول</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
        body { background: #0b1120; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; border-radius: 32px; padding: 30px; width: 100%; max-width: 450px; }
        h1 { text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 40px; border: none; background: #0f172a; color: white; }
        button { width: 100%; padding: 10px; margin-top: 12px; border-radius: 40px; border: none; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; }
        .btn-outline { background: transparent; border: 1px solid #3b82f6; }
        .tab { display: flex; gap: 12px; margin-bottom: 20px; }
        .tab button { background: transparent; border: 1px solid #334155; }
        .active-tab { background: #3b82f6 !important; border: none !important; }
        .error { color: #f87171; margin-top: 8px; font-size: 14px; }
        .success { color: #34d399; margin-top: 8px; }
    </style>
</head>
<body>
<div class="card">
    <h1>🧘 Focus Mode</h1>
    <div class="tab">
        <button id="loginTabBtn" class="active-tab" onclick="switchTab('login')">تسجيل الدخول</button>
        <button id="registerTabBtn" onclick="switchTab('register')">إنشاء حساب</button>
    </div>

    <div id="loginPanel">
        <input type="email" id="loginEmail" placeholder="البريد الإلكتروني">
        <input type="password" id="loginPassword" placeholder="كلمة المرور">
        <button onclick="doLogin()">دخول</button>
        <div id="loginError" class="error"></div>
    </div>

    <div id="registerPanel" style="display:none;">
        <input type="text" id="regName" placeholder="الاسم الكامل">
        <input type="email" id="regEmail" placeholder="البريد الإلكتروني">
        <input type="password" id="regPassword" placeholder="كلمة المرور">
        <input type="password" id="regConfirm" placeholder="تأكيد كلمة المرور">
        <button onclick="doRegister()">إنشاء حساب</button>
        <div id="regError" class="error"></div>
        <div id="regSuccess" class="success"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCFydOV8EjlhD4AASTZFU1keYA3I6UQHyw",
        authDomain: "foucsmode-95e4f.firebaseapp.com",
        projectId: "foucsmode-95e4f",
        storageBucket: "foucsmode-95e4f.firebasestorage.app",
        messagingSenderId: "972730357334",
        appId: "1:972730357334:web:f2d3044a7c8eed588b8df7"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    function switchTab(tab) {
        document.getElementById("loginPanel").style.display = tab === "login" ? "block" : "none";
        document.getElementById("registerPanel").style.display = tab === "register" ? "block" : "none";
        document.getElementById("loginTabBtn").classList.toggle("active-tab", tab === "login");
        document.getElementById("registerTabBtn").classList.toggle("active-tab", tab === "register");
    }

    async function doLogin() {
        const email = document.getElementById("loginEmail").value.trim();
        const pass = document.getElementById("loginPassword").value;
        const errorDiv = document.getElementById("loginError");
        if (!email || !pass) { errorDiv.innerText = "⚠️ املأ جميع الحقول"; return; }
        try {
            const res = await auth.signInWithEmailAndPassword(email, pass);
            const user = res.user;
            const snap = await db.ref(`users/${user.uid}`).once("value");
            let userData = snap.val();
            if (!userData) {
                let role = email === "admin@focus.com" ? "admin" : (email === "teacher@focus.com" ? "teacher" : "student");
                let name = role === "admin" ? "مدير النظام" : (role === "teacher" ? "أستاذ" : email.split("@")[0]);
                userData = { email, role, displayName: name, points: 0, badges: [] };
                await db.ref(`users/${user.uid}`).set(userData);
            }
            localStorage.setItem("focusModeUser", JSON.stringify({ uid: user.uid, role: userData.role }));
            if (userData.role === "admin") window.location.href = "admin.html";
            else if (userData.role === "teacher") window.location.href = "teacher.html";
            else window.location.href = "student.html";
        } catch (err) {
            errorDiv.innerText = "❌ " + (err.message || "فشل تسجيل الدخول");
        }
    }

    async function doRegister() {
        const name = document.getElementById("regName").value.trim();
        const email = document.getElementById("regEmail").value.trim();
        const pass = document.getElementById("regPassword").value;
        const confirm = document.getElementById("regConfirm").value;
        const errorDiv = document.getElementById("regError");
        const successDiv = document.getElementById("regSuccess");
        errorDiv.innerText = ""; successDiv.innerText = "";
        if (!name || !email || !pass) { errorDiv.innerText = "⚠️ املأ جميع الحقول"; return; }
        if (pass !== confirm) { errorDiv.innerText = "⚠️ كلمة المرور غير متطابقة"; return; }
        if (pass.length < 6) { errorDiv.innerText = "⚠️ كلمة المرور 6 أحرف على الأقل"; return; }
        try {
            const res = await auth.createUserWithEmailAndPassword(email, pass);
            await db.ref(`users/${res.user.uid}`).set({ email, role: "student", displayName: name, points: 0, badges: [], createdAt: new Date().toISOString() });
            successDiv.innerText = "✅ تم إنشاء الحساب! يمكنك تسجيل الدخول";
            setTimeout(() => window.location.reload(), 2000);
        } catch (err) {
            errorDiv.innerText = "❌ " + (err.message || "فشل إنشاء الحساب");
        }
    }

    // إذا كان مسجل دخول مسبقاً
    auth.onAuthStateChanged(async (u) => {
        if (u) {
            let snap = await db.ref(`users/${u.uid}`).once("value");
            let role = snap.val()?.role;
            if (role === "admin") window.location.href = "admin.html";
            else if (role === "teacher") window.location.href = "teacher.html";
            else if (role === "student") window.location.href = "student.html";
        }
    });
</script>
</body>
</html>
