<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Mode - الأستاذ</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui; }
        body { background:#0b1120; color:#e2e8f0; padding:20px; }
        .container { max-width:1300px; margin:auto; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
        .btn { padding:8px 16px; border-radius:40px; border:none; cursor:pointer; font-weight:bold; background:#1e293b; color:white; margin:4px; }
        .btn-primary { background:#3b82f6; }
        .btn-outline { background:transparent; border:1px solid #3b82f6; color:#93c5fd; }
        .btn-danger { background:#dc2626; }
        .btn-success { background:#10b981; }
        .card { background:#1e293b; border-radius:24px; padding:20px; margin-bottom:20px; }
        .grid-2 { display:grid; grid-template-columns:1fr 2fr; gap:20px; }
        .timer { font-size:48px; font-weight:bold; text-align:center; background:#0f172a; border-radius:40px; padding:15px; }
        .prayer-grid { display:flex; gap:12px; flex-wrap:wrap; margin:15px 0; }
        .prayer-item { background:#0f172a; padding:8px 12px; border-radius:40px; text-align:center; flex:1; }
        .answer-card { background:#0f172a; border-radius:20px; padding:12px; margin-bottom:12px; }
        .flex-between { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
        .badge-correct { background:#10b981; padding:2px 12px; border-radius:30px; font-size:12px; }
        .badge-wrong { background:#dc2626; padding:2px 12px; border-radius:30px; }
        input, textarea, select { background:#0f172a; border:1px solid #334155; border-radius:40px; padding:10px 16px; color:white; width:100%; margin:6px 0; }
        hr { margin:15px 0; border-color:#334155; }
        @media (max-width:800px){ .grid-2{ grid-template-columns:1fr; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>👨‍🏫 لوحة الأستاذ - Focus Mode</h1><button class="btn btn-danger" onclick="logout()">🚪 خروج</button></div>
    <div><button class="btn btn-primary" onclick="showTab('answers')">📝 الإجابات</button><button class="btn btn-outline" onclick="showTab('schedule')">📅 جدول أسبوعي</button><button class="btn btn-outline" onclick="showTab('leaderboard')">🏆 المتصدرين</button></div>

    <div id="tab-answers" class="grid-2">
        <div class="card"><h3>⏱️ مؤقت الدراسة</h3><div class="timer" id="timerDisplay">25:00</div><div><input type="number" id="minutesInput" value="25" style="width:100px;"> دقيقة</div><div><button class="btn btn-primary" id="startBtn">▶️ بدء</button><button class="btn btn-outline" id="pauseBtn">⏸️ إيقاف</button><button class="btn btn-outline" id="resetBtn">🔄 إعادة</button></div><hr><h3>🕌 أوقات الصلاة</h3><div id="prayerTimes" class="prayer-grid"></div><div id="nextPrayer"></div></div>
        <div class="card"><h3>📬 إجابات الطلاب</h3><input type="text" id="searchInput" placeholder="بحث..."><div id="answersList"></div><hr><textarea id="broadcastMsg" rows="2" placeholder="رسالة جماعية"></textarea><button class="btn btn-primary" onclick="sendBroadcast()">📢 إرسال</button></div>
    </div>

    <div id="tab-schedule" style="display:none;"><div class="card"><h3>📅 جدول أسبوعي</h3><select id="weekDay"><option>الأحد</option><option>الإثنين</option><option>الثلاثاء</option><option>الأربعاء</option><option>الخميس</option><option>الجمعة</option><option>السبت</option></select><input type="text" id="taskTime" placeholder="الوقت"><input type="text" id="taskName" placeholder="المهمة"><button class="btn btn-primary" onclick="addTask()">➕ إضافة</button><hr><div id="scheduleList"></div></div></div>
    <div id="tab-leaderboard" style="display:none;"><div class="card"><h3>🏆 المتصدرين</h3><div id="leaderboardBox"></div></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script>
    const firebaseConfig = { apiKey: "AIzaSyCFydOV8EjlhD4AASTZFU1keYA3I6UQHyw", authDomain: "foucsmode-95e4f.firebaseapp.com", projectId: "foucsmode-95e4f", storageBucket: "foucsmode-95e4f.firebasestorage.app", messagingSenderId: "972730357334", appId: "1:972730357334:web:f2d3044a7c8eed588b8df7" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();
    let currentUser = null;

    auth.onAuthStateChanged(async (u) => {
        if (!u) { window.location.href = "login.html"; return; }
        currentUser = u;
        let snap = await db.ref(`users/${u.uid}`).once("value");
        let role = snap.val()?.role;
        if (role !== "teacher" && role !== "admin") { window.location.href = "login.html"; return; }
        loadAll();
    });
    function logout() { auth.signOut().then(() => window.location.href = "login.html"); }
    function showTab(tab) { document.getElementById("tab-answers").style.display = "none"; document.getElementById("tab-schedule").style.display = "none"; document.getElementById("tab-leaderboard").style.display = "none"; document.getElementById(`tab-${tab}`).style.display = "grid"; if(tab==="schedule") loadSchedule(); if(tab==="leaderboard") loadLeaderboard(); }

    async function loadAll() { loadSubmissions(); loadPrayerTimes(); loadSchedule(); loadLeaderboard(); setInterval(()=>loadSubmissions(),4000); setInterval(loadPrayerTimes,60000); }

    // Timer
    let timeLeft = 25*60, timerInterval=null;
    const timerEl = document.getElementById("timerDisplay");
    function updateTimer() { let m=Math.floor(timeLeft/60), s=timeLeft%60; timerEl.innerText=`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }
    function startTimer() { if(timerInterval) clearInterval(timerInterval); timerInterval = setInterval(()=>{ if(timeLeft>0){ timeLeft--; updateTimer(); } else { clearInterval(timerInterval); alert("انتهى الوقت!"); } },1000); }
    function pauseTimer() { if(timerInterval) clearInterval(timerInterval); timerInterval=null; }
    function resetTimer() { pauseTimer(); let mins=parseInt(document.getElementById("minutesInput").value)||25; timeLeft=mins*60; updateTimer(); }
    document.getElementById("startBtn")?.addEventListener("click",startTimer);
    document.getElementById("pauseBtn")?.addEventListener("click",pauseTimer);
    document.getElementById("resetBtn")?.addEventListener("click",resetTimer);
    resetTimer();

    async function loadPrayerTimes() {
        try {
            let d=new Date(), url=`https://api.aladhan.com/v1/timings/${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}?latitude=24.4539&longitude=54.3773&method=8&timezonestring=Asia/Dubai`;
            let res=await fetch(url), data=await res.json();
            if(data.code===200){
                let t=data.data.timings, prayers=["Fajr","Dhuhr","Asr","Maghrib","Isha"], names=["الفجر","الظهر","العصر","المغرب","العشاء"];
                let html=""; for(let i=0;i<prayers.length;i++) html+=`<div class="prayer-item"><div>${names[i]}</div><div>${t[prayers[i]]}</div></div>`;
                document.getElementById("prayerTimes").innerHTML=html;
                let nowMin=new Date().getHours()*60+new Date().getMinutes(), next=null, minDiff=Infinity;
                for(let i=0;i<prayers.length;i++){ let [h,m]=t[prayers[i]].split(":"); let pm=parseInt(h)*60+parseInt(m); let diff=pm-nowMin; if(diff>0 && diff<minDiff){ minDiff=diff; next=names[i]; } }
                if(!next){ let [h,m]=t["Fajr"].split(":"); minDiff=(24*60-nowMin)+(parseInt(h)*60+parseInt(m)); next="الفجر"; }
                document.getElementById("nextPrayer").innerHTML=`🕋 القادمة: ${next} بعد ${Math.floor(minDiff/60)} س و ${minDiff%60} د`;
            }
        } catch(e){ console.warn(e); }
    }

    let allSubmissions=[];
    async function loadSubmissions(){ let snap=await db.ref("submissions").once("value"); let data=snap.val()||{}; allSubmissions=Object.entries(data).map(([id,val])=>({id,...val})).reverse(); renderAnswers(); }
    function renderAnswers(){
        let search=document.getElementById("searchInput")?.value.toLowerCase()||"";
        let filtered=allSubmissions.filter(s=>s.studentName?.toLowerCase().includes(search)||s.text?.toLowerCase().includes(search));
        let container=document.getElementById("answersList");
        if(!filtered.length){ container.innerHTML="<div class='card'>✨ لا إجابات</div>"; return; }
        let html="";
        filtered.forEach(sub=>{
            let badge=sub.grade==="correct"?"<span class='badge-correct'>✓ صحيح +5</span>":(sub.grade==="wrong"?"<span class='badge-wrong'>✗ خطأ</span>":"<span class='badge-wrong'>⏳ قيد</span>");
            html+=`<div class="answer-card"><div class="flex-between"><div><strong>${escapeHtml(sub.studentName)}</strong> <small>${new Date(sub.timestamp).toLocaleString()}</small></div>${badge}</div><div>${sub.text?escapeHtml(sub.text):""} ${sub.imageUrl?`<a href="${sub.imageUrl}" target="_blank">🖼️</a>`:""}</div>${sub.feedback?`📩 ${escapeHtml(sub.feedback)}`:""}<div class="flex-between"><button class="btn btn-success" onclick="gradeSub('${sub.id}','correct')">✔️ صحيح</button><button class="btn btn-danger" onclick="gradeSub('${sub.id}','wrong')">❌ خطأ</button><button class="btn" onclick="sendMsg('${sub.id}')">💬 رسالة</button></div></div>`;
        });
        container.innerHTML=html;
    }
    window.gradeSub=async(id,grade)=>{ let sub= (await db.ref(`submissions/${id}`).once("value")).val(); if(!sub) return; let msg=grade==="correct"?"✅ أحسنت! +5":"❌ حاول مرة أخرى"; await db.ref(`submissions/${id}`).update({grade,feedback:msg}); if(grade==="correct"){ let points=(await db.ref(`users/${sub.studentId}/points`).once("value")).val()||0; await db.ref(`users/${sub.studentId}/points`).set(points+5); } loadSubmissions(); };
    window.sendMsg=async(id)=>{ let msg=prompt("أكتب رسالتك للطالب:"); if(msg) await db.ref(`submissions/${id}`).update({feedback:msg}); loadSubmissions(); };
    window.sendBroadcast=async()=>{ let msg=document.getElementById("broadcastMsg").value.trim(); if(!msg) return alert("اكتب رسالة"); await db.ref("broadcast").push({message:msg,time:Date.now()}); alert("✅ أرسلت"); };
    function escapeHtml(str){ if(!str) return ""; return str.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"})[m]); }

    async function loadSchedule(){ let snap=await db.ref("weekly_schedule").once("value"); let s=snap.val()||{}; let days=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"]; let html=""; for(let day of days){ if(s[day] && s[day].length){ html+=`<div class="card"><strong>📅 ${day}</strong>`; s[day].forEach(t=>html+=`<div>⏰ ${escapeHtml(t.time)} - ${escapeHtml(t.task)}</div>`); html+=`</div>`; } } if(!html) html="<div class='card'>📭 لا مهام</div>"; document.getElementById("scheduleList").innerHTML=html; }
    window.addTask=async()=>{ let day=document.getElementById("weekDay").value, time=document.getElementById("taskTime").value.trim(), task=document.getElementById("taskName").value.trim(); if(!time||!task)return; let ref=db.ref(`weekly_schedule/${day}`); let arr=(await ref.once("value")).val()||[]; arr.push({time,task}); await ref.set(arr); loadSchedule(); };
    async function loadLeaderboard(){ let users= (await db.ref("users").once("value")).val()||{}; let students=Object.values(users).filter(u=>u.role==="student"); students.sort((a,b)=>(b.points||0)-(a.points||0)); let html=""; students.forEach((s,i)=> html+=`<div class="card flex-between"><div><strong>${i+1}.</strong> ${escapeHtml(s.displayName)}</div><div>⭐ ${s.points||0}</div></div>`); if(!html) html="<div class='card'>🏆 لا نقاط</div>"; document.getElementById("leaderboardBox").innerHTML=html; }
</script>
</body>
</html>
